<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>028Labs — Calculadora de Precificação</title>
<style>
  :root{
    --bg: #f6f5f1;
    --panel: #ffffff;
    --input-bg: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #5a564e;
    --line: #e4e1d8;
    --accent: #e8590c;
    --accent-dark: #b8430a;
    --accent-soft: #fdeee3;
    --locked-bg: #f1f0ec;
    --locked-text: #6b6860;
    --ok: #2f7d4f;
    --danger: #b3261e;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  :root[data-theme="dark"]{
    --bg: #141311;
    --panel: #1e1d1a;
    --input-bg: #242320;
    --ink: #f2f0ea;
    --ink-soft: #a8a49b;
    --line: #34322c;
    --accent-soft: #3a2818;
    --locked-bg: #26251f;
    --locked-text: #8f8b82;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; transition:background .15s, color .15s;
  }
  .side{position:relative;}
  .theme-toggle{
    position:absolute; top:16px; right:14px; z-index:5; all:unset; cursor:pointer;
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:#2a2925; border:1px solid #3a3833; color:#f6f5f1; font-size:14px; transition:background .12s;
  }
  .theme-toggle:hover{background:#33312c;}
  .shell{display:flex; min-height:100vh;}
  .side{
    width:220px; flex-shrink:0; background:#1c1b19; color:#f6f5f1;
    padding:28px 0; display:flex; flex-direction:column;
  }
  .brand{padding:0 20px 24px; border-bottom:1px solid #33312c; margin-bottom:12px;}
  .brand-logo{display:block; width:150px; max-width:100%; height:auto; margin:0 0 14px;}
  .brand .sub{font-size:12px; color:#93908a; margin-top:4px;}
  nav{display:flex; flex-direction:column; gap:2px; padding:0 10px;}
  nav button{
    all:unset; cursor:pointer; padding:11px 14px; border-radius:6px; font-size:14px;
    color:#c9c6bf; transition:background .12s, color .12s;
  }
  nav button:hover{background:#2a2925; color:#fff;}
  nav button.active{background:var(--accent); color:#fff; font-weight:600;}
  .side-foot{margin-top:auto; padding:16px 20px 0; font-size:11px; border-top:1px solid #33312c;}
  .sync-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .sync-dot.ok{background:#3fb56e;}
  .sync-dot.busy{background:#e8a83c; animation:pulse 1s infinite;}
  .sync-dot.err{background:#e0574c;}
  .sync-dot.off{background:#6b6860;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  main{flex:1; padding:32px 40px; max-width:1180px;}
  h1{font-size:24px; margin:0 0 4px;}
  .lead{color:var(--ink-soft); font-size:14px; margin:0 0 28px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px; margin-bottom:20px;}
  .card h2{font-size:15px; margin:0 0 4px; font-weight:700;}
  .card summary::-webkit-details-marker{display:none;}
  .card summary::marker{content:'';}
  details.card[open] summary{border-bottom:1px solid var(--line); margin-bottom:0;}
  .card .card-note{font-size:12.5px; color:var(--ink-soft); margin:0 0 18px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  input, select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--sans); font-size:13.5px; background:var(--input-bg); color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field{margin-bottom:0;}
  .field.locked input{background:var(--locked-bg); color:var(--locked-text); border-color:var(--line);}
  .dhm-group{display:flex; gap:6px;}
  .dhm-item{flex:1; display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:6px; padding:0 8px; background:var(--input-bg);}
  .dhm-item input{border:none; padding:8px 0; width:100%; text-align:right;}
  .dhm-item span{font-size:11px; color:var(--ink-soft); flex-shrink:0;}
  .field.locked label{display:flex; align-items:center; gap:5px;}
  .lock-tag{font-size:9px; background:var(--locked-bg); color:var(--locked-text); padding:1px 5px; border-radius:3px; font-weight:700; letter-spacing:.03em;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:700;}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);}
  .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .btn{all:unset; cursor:pointer; padding:9px 16px; border-radius:6px; font-size:13.5px; font-weight:600; background:var(--accent); color:#fff; transition:background .12s;}
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.ghost:hover{background:#f0efea;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid #e6b3ae;}
  .btn.danger:hover{background:#fbeceb;}
  .row-actions{display:flex; gap:6px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .empty{padding:26px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:700;}
  .badge.orc{background:#eee7d8; color:#7a6a2c;}
  .badge.apr{background:#e2ecfb; color:#2a5b9c;}
  .badge.prod{background:#f4e3c7; color:#8a5a10;}
  .badge.fin{background:#dcefe1; color:#256d3c;}
  .badge.ent{background:#d8f0e3; color:#1c7a45;}
  .badge.can{background:#f5dcda; color:#a33128;}
  .result-strip{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .result-cell{padding:16px 18px; border-bottom:1px solid var(--line);}
  .result-cell:last-child{border-bottom:none;}
  .result-cell .k{font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .result-cell .v{font-family:var(--mono); font-size:19px; font-weight:700;}
  .result-cell.hero{background:var(--accent); color:#fff;}
  .result-cell.hero .k{color:#ffe2ce;}
  .breakdown{display:grid; grid-template-columns:1fr; gap:0; margin-top:14px; font-size:13px;}
  .breakdown .line{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line);}
  .breakdown .line span:first-child{color:var(--ink-soft);}
  .breakdown .line span:last-child{font-family:var(--mono);}
  .two-col{display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start;}
  .result-panel{position:sticky; top:20px;}
  @keyframes priceFlash{ 0%{ transform:scale(1.045); filter:brightness(1.3);} 100%{ transform:scale(1); filter:brightness(1);} }
  .result-cell.hero .v{ animation: priceFlash .35s ease-out; }
  details.subdetails{border:1px solid var(--line); border-radius:8px; margin-top:14px; background:var(--panel);}
  details.subdetails summary{cursor:pointer; padding:12px 14px; font-weight:700; font-size:13.5px; list-style:none;}
  details.subdetails summary::-webkit-details-marker{display:none;}
  details.subdetails summary::marker{content:'';}
  details.subdetails[open] summary{border-bottom:1px solid var(--line);}
  details.subdetails > div{padding:14px;}
  .add-item-row{display:flex; gap:8px; margin-bottom:14px; align-items:flex-end;}
  .mobile-nav{display:none; position:fixed; left:0; right:0; bottom:0; background:#1c1b19; border-top:1px solid #33312c; z-index:55; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));}
  .mnav-btn{all:unset; cursor:pointer; flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:#93908a; font-size:10px; border-radius:8px; text-align:center;}
  .mnav-btn .mnav-ic{font-size:17px; line-height:1;}
  .mnav-btn.active{color:#fff;}
  .mobile-more-sheet{display:none; position:fixed; left:10px; right:10px; bottom:72px; background:#242320; border:1px solid #33312c; border-radius:10px; padding:6px; z-index:56; flex-direction:column; gap:2px; box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .mnav-sheet-btn{all:unset; cursor:pointer; padding:11px 12px; border-radius:6px; color:#c9c6bf; font-size:13.5px; display:flex; align-items:center; gap:8px;}
  .mnav-sheet-btn.active{background:var(--accent); color:#fff; font-weight:600;}
  .tag-note{background:var(--accent-soft); border:1px solid #f6c9a8; color:#8a4318; font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:18px;}
  .tag-note.info{background:#eef3fb; border-color:#c3d6f0; color:#2a4d7c;}
  .tag-note.err{background:#fbecea; border-color:#eab7ae; color:#8a2f22;}
  code{background:var(--locked-bg); padding:1px 6px; border-radius:4px; font-family:var(--mono); font-size:12px;}
  ol.steps{padding-left:20px; font-size:13.5px; line-height:1.8;}
  #pdf-print-area{display:none;}
  .pdf-doc{font-family:var(--sans); color:#1c1b19; padding:40px; max-width:700px; margin:0 auto; background:#fff;}
  .pdf-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:3px solid #e8590c; padding-bottom:14px; margin-bottom:24px;}
  .pdf-brand{font-size:22px; font-weight:800; color:#e8590c; letter-spacing:.02em;}
  .pdf-doc-title{font-size:14px; color:#5a564e;}
  .pdf-meta{display:flex; gap:24px; font-size:13px; color:#5a564e; margin-bottom:28px;}
  .pdf-item{border:1px solid #e4e1d8; border-radius:10px; padding:20px 22px; margin-bottom:28px;}
  .pdf-item-nome{font-size:19px; font-weight:700; margin-bottom:14px;}
  .pdf-item-linha{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed #e4e1d8; font-size:14px;}
  .pdf-item-linha:last-child{border-bottom:none;}
  .pdf-item-linha span:first-child{color:#5a564e;}
  .pdf-valor{background:#e8590c; color:#fff; border-radius:10px; padding:22px; text-align:center; margin-bottom:24px;}
  .pdf-valor-k{font-size:12px; letter-spacing:.06em; opacity:.85; margin-bottom:4px;}
  .pdf-valor-v{font-size:32px; font-weight:800; font-family:var(--mono);}
  .pdf-valor-unit{font-size:12px; opacity:.85; margin-top:4px;}
  .pdf-foot{font-size:11px; color:#93908a; text-align:center;}
  @media print{
    @page{margin:18mm;}
    body *{visibility:hidden;}
    #pdf-print-area, #pdf-print-area *{visibility:visible;}
    #pdf-print-area{display:block; position:absolute; left:0; top:0; width:100%;}
    .theme-toggle, .mobile-nav, .mobile-more-sheet{display:none !important;}
  }
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .side{display:none;}
    main{padding:16px; padding-bottom:92px;}
    .two-col{grid-template-columns:1fr;}
    .two-col .result-col{order:-1;}
    .result-panel{position:static;}
    .mobile-nav{display:flex;}
  }
  @media (max-width:480px){
    .add-item-row{flex-direction:column; align-items:stretch;}
  }
</style>
</head>

<script>
const LS_SETTINGS_KEY = '028labs_github_settings';
const LS_DATA_KEY = '028labs_local_cache';

// Valores iniciais de referência para uma pequena operação de impressão 3D
// em Nova Venécia — ES, com Bambu Lab A1 como impressora principal.
// São só um ponto de partida: tudo aqui é editável na aba Configurações.
const DEFAULT_CONFIG = {
  // Energia — valor de referência inicial, não é tarifa oficial fixa.
  // Ajuste pelo valor efetivamente pago na sua conta de luz.
  precoKWh: 0.95,

  // Impressora padrão (usado só quando um pedido não tem impressora selecionada) — Bambu Lab A1.
  // 95W é consumo médio de impressão, NÃO a potência máxima da fonte (1300W@220V / 350W@110V é pico, não uso contínuo).
  potenciaPadraoW: 95,
  valorImpressoraPadrao: 3500, // preço de referência da A1 no Brasil — varia por loja/promoção/frete/AMS Lite
  vidaUtilPadrao: 8000,        // premissa de rateio de depreciação, não uma garantia de vida útil real
  manutencaoMensalPadrao: 50,
  horasMesPadrao: 180,         // ~6h/dia x 30 dias — parâmetro de rateio, não promessa de uso constante

  // Mão de obra — valor fixo por pedido (sem detalhar tarefa/hora). Este é só o valor sugerido
  // que preenche novos orçamentos; ajuste por pedido conforme o trabalho real de cada peça.
  maoObraPadrao: 0,

  // Custos indiretos / overhead — rateio de despesas administrativas (internet, software, espaço etc.),
  // nunca duplica energia, depreciação, manutenção ou material, que já são calculados à parte.
  // Calibrado com o overhead real do 028Labs: produção no quarto (sem espaço alugado), único custo
  // fixo é a internet (R$119/mês) ÷ ~180h produtivas/mês ≈ R$0,66/h. Ajuste aqui se seu overhead mudar
  // (novo espaço, novos assinaturas, etc.) — um valor genérico como R$10/h infla demais peças pequenas
  // e rápidas (chaveiros, vasos) para bem acima do preço de mercado.
  custosIndiretosHora: 0.66,

  // Perdas e risco — reservas médias, não previsão exata por peça
  percPerdas: 0.05,  // 5% de perda de material (purgas, suportes, brim, sobras)
  percFalha: 0.03,   // 3% de reserva para falhas/reimpressões (não é previsão de que 3% das peças vão falhar)

  // Tributação / margem — estimativas iniciais, ajuste conforme seu regime tributário e canal de venda
  percImpostos: 0.06,
  percMargem: 0.30,
  percComissao: 0, // mantido por compatibilidade (usado só pelos testes internos abaixo)
  // Comissão por canal: agora é um catálogo (aba "Canais de Venda"), igual Embalagens/Adicionais —
  // veja state.canais e seedExample() mais abaixo.

  // Embalagens são cadastradas e escolhidas por item no próprio orçamento (aba Embalagens) — não há
  // mais um valor fixo aqui, para não somar em dobro com os itens escolhidos.

  // Descontos comerciais
  descPromocional: 0.10,
  descAtacado: 0.15,

  // Segurança comercial — ativado por padrão: não deixa salvar promo/atacado abaixo do preço mínimo
  impedirPrecoAbaixoMinimo: true
};

let state = { config: { ...DEFAULT_CONFIG }, materiais: [], impressoras: [], extras: [], canais: [], pedidos: [] };
let github = { owner:'', repo:'', path:'data.json', branch:'main', token:'' };
let ghSha = null;
let syncState = 'off'; // off | busy | ok | err
let syncMsg = '';
let tab = 'novo';
let theme = localStorage.getItem('028labs_theme') || 'light';
let moreOpen = false;
let compraSelecionada = ''; // '' = nada escolhido ainda, '__novo__' = filamento novo, ou o id de um material existente
let compraDraft = null;     // { nome, marca, tipo, pesoRolo, precoRolo, fornecedor, data }
let editingPedidoId = null;
let draft = null;
let saveTimer = null;
let dirty = false; // true entre uma edição e o push confirmado — nunca fazemos refetch automático nesse meio-tempo
let formErrors = [];

// ---------- migrations (keep old saved data working with the new model) ----------
function migrateConfig(raw){
  const c = { ...DEFAULT_CONFIG, ...(raw||{}) };
  if (raw && raw.custosIndiretosHora === undefined && raw.adminHora !== undefined) c.custosIndiretosHora = raw.adminHora;
  return c;
}
// Canais de venda viraram um catálogo (igual Embalagens/Adicionais). Versões anteriores guardavam
// a comissão de cada canal direto em Configurações — se isso existir e o catálogo ainda estiver
// vazio, migra uma vez só; nunca sobrescreve um catálogo que a pessoa já editou.
function migrateCanais(rawCanais, rawConfig){
  if (Array.isArray(rawCanais) && rawCanais.length) return rawCanais;
  if (rawConfig && (rawConfig.comissaoFisica!==undefined || rawConfig.comissaoShopee!==undefined || rawConfig.comissaoMercadoLivre!==undefined)){
    return [
      { id:'canal-fisica', nome:'Física', comissao: rawConfig.comissaoFisica||0 },
      { id:'canal-shopee', nome:'Shopee', comissao: rawConfig.comissaoShopee||0 },
      { id:'canal-mercadolivre', nome:'Mercado Livre', comissao: rawConfig.comissaoMercadoLivre||0 },
    ];
  }
  return [];
}
// Embalagens e Adicionais viraram um catálogo só ("Extras"). Versões anteriores guardavam dois
// catálogos separados — se "extras" ainda estiver vazio e algum dos dois antigos existir, migra
// uma vez só (preservando os mesmos ids, pra não quebrar referências em pedidos salvos); nunca
// sobrescreve um catálogo "extras" que a pessoa já editou.
function migrateExtras(rawExtras, rawEmbalagens, rawAdicionais){
  if (Array.isArray(rawExtras) && rawExtras.length) return rawExtras;
  const fromEmb = (rawEmbalagens||[]).map(e => ({ id:e.id, nome:e.nome, valor:e.valor, tipoCobranca:'unidade' }));
  const fromAdc = (rawAdicionais||[]).map(a => ({ id:a.id, nome:a.nome, valor:a.valor, tipoCobranca:a.tipoCobranca||'unidade' }));
  return [...fromEmb, ...fromAdc];
}
function migratePedido(p){
  return {
    id: p.id, numero: p.numero, data: p.data, cliente: p.cliente||'', produto: p.produto||'',
    quantidade: p.quantidade||0, materialId: p.materialId||'', peso: p.peso||0,
    materiaisItens: Array.isArray(p.materiaisItens) ? p.materiaisItens : [],
    impressoraId: p.impressoraId||'', tempoImpressao: p.tempoImpressao||0,
    canalVendaId: p.canalVendaId ?? (p.canalVenda==='shopee' ? 'canal-shopee' : p.canalVenda==='mercadolivre' ? 'canal-mercadolivre' : p.canalVenda==='fisica' ? 'canal-fisica' : ''),
    // Produção em lote/fornadas (opcional): peso/tempo passam a valer para UMA fornada cheia, e o
    // app calcula quantas fornadas cheias + uma fornada menor são necessárias, ou rateia uma
    // fornada já feita entre pedidos menores. Override manual pra fornada menor é opcional.
    usaLote: p.usaLote ?? false,
    capacidadeFornada: p.capacidadeFornada ?? 0,
    tempoFornadaParcial: p.tempoFornadaParcial ?? 0,
    pesoFornadaParcialOverride: p.pesoFornadaParcialOverride ?? 0,
    // Mão de obra virou um valor fixo por pedido — pedidos antigos, que detalhavam tempos por
    // lote/fornada/peça, não têm mais esse detalhamento recalculado; caem em R$0 e podem ser
    // ajustados manualmente se o pedido for reaberto (orçamentos antigos não precisam bater
    // com o valor exato de quando foram feitos).
    maoObraValor: p.maoObraValor ?? 0,
    // embalagens e adicionais escolhidos neste orçamento (itens do catálogo único "Extras" + quantidade)
    extrasItens: Array.isArray(p.extrasItens) ? p.extrasItens
      : [...(Array.isArray(p.embalagensItens)?p.embalagensItens:[]).map(it=>({ lineId:it.lineId, extraId:it.embalagemId, quantidade:it.quantidade })),
         ...(Array.isArray(p.adicionaisItens)?p.adicionaisItens:[]).map(it=>({ lineId:it.lineId, extraId:it.adicionalId, quantidade:it.quantidade }))],
    status: p.status || 'Orçamento'
  };
}

// ---------- github settings (local only, never synced) ----------
function loadSettings(){
  try{ const raw = localStorage.getItem(LS_SETTINGS_KEY); if (raw) github = { ...github, ...JSON.parse(raw) }; } catch(e){}
  // Link de configuração rápida: só owner/repo/branch/path vêm pela URL (nunca o token — por
  // segurança, o token precisa sempre ser digitado/colado manualmente em cada dispositivo).
  try{
    const params = new URLSearchParams(window.location.search);
    let veioDaUrl = false;
    ['owner','repo','branch','path'].forEach(k=>{
      if (params.has(k) && params.get(k)){ github[k] = params.get(k); veioDaUrl = true; }
    });
    if (veioDaUrl) saveSettings();
  } catch(e){}
}
function saveSettings(){ localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(github)); }
function githubConfigured(){ return !!(github.owner && github.repo && github.token); }
function linkConfiguracaoRapida(){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('owner', github.owner||'');
  url.searchParams.set('repo', github.repo||'');
  url.searchParams.set('branch', github.branch||'main');
  url.searchParams.set('path', github.path||'data.json');
  return url.toString();
}

// ---------- base64 (unicode-safe) ----------
function b64Encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64Decode(b64){
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// ---------- github sync ----------
async function ghFetch(){
  if (!githubConfigured()) return;
  setSync('busy','Buscando dados do GitHub…');
  try{
    const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}?ref=${github.branch}`;
    const res = await fetch(url, { headers: { Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json' } });
    if (res.status === 404){ ghSha = null; setSync('ok','Repositório vazio — será criado no próximo salvamento.'); return; }
    if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
    const json = await res.json();
    ghSha = json.sha;
    const content = b64Decode(json.content);
    const remote = JSON.parse(content);
    state = {
      config: migrateConfig(remote.config),
      materiais: remote.materiais||[],
      impressoras: remote.impressoras||[],
      extras: migrateExtras(remote.extras, remote.embalagens, remote.adicionais),
      canais: migrateCanais(remote.canais, remote.config),
      pedidos: (remote.pedidos||[]).map(migratePedido)
    };
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(state));
    setSync('ok', 'Sincronizado com o GitHub.');
  } catch(e){
    setSync('err', 'Falha ao buscar do GitHub: ' + e.message);
  }
}
// Busca APENAS o SHA mais recente do arquivo remoto, sem tocar em `state`.
// Usada na resolução de conflitos para nunca sobrescrever silenciosamente o estado local.
async function ghGetLatestSha(){
  const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}?ref=${github.branch}`;
  const res = await fetch(url, { headers: { Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
  const json = await res.json();
  return json.sha;
}
async function ghPush(retry){
  if (!githubConfigured()) { localStorage.setItem(LS_DATA_KEY, JSON.stringify(state)); return true; }
  setSync('busy','Salvando no GitHub…');
  try{
    const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}`;
    const body = { message:`Atualiza dados — ${new Date().toLocaleString('pt-BR')}`, content: b64Encode(JSON.stringify(state,null,2)), branch: github.branch };
    if (ghSha) body.sha = ghSha;
    const res = await fetch(url, { method:'PUT', headers:{ Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (res.status === 409){
      if (retry){
        // Já tentamos uma vez preservando o estado local e mesmo assim houve outro conflito.
        // Não sobrescrevemos nada silenciosamente — avisamos e paramos.
        setSync('err', 'Conflito de sincronização no GitHub — suas alterações NÃO foram perdidas e continuam só neste navegador. Abra a aba Sincronização e tente salvar novamente.');
        return false;
      }
      // Preserva `state` local integralmente. Busca só o SHA mais recente para poder tentar de novo.
      try{
        ghSha = await ghGetLatestSha();
      } catch(shaErr){
        setSync('err', 'Conflito de sincronização no GitHub e falha ao obter a versão mais recente: ' + shaErr.message);
        return false;
      }
      return ghPush(true);
    }
    if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
    const json = await res.json();
    ghSha = json.content.sha;
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(state));
    setSync('ok', 'Salvo no GitHub às ' + new Date().toLocaleTimeString('pt-BR'));
    return true;
  } catch(e){
    setSync('err', 'Falha ao salvar no GitHub: ' + e.message);
    return false;
  }
}
function setSync(s,msg){ syncState=s; syncMsg=msg; renderSyncStatus(); }
function renderSyncStatus(){
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (!githubConfigured()){
    el.innerHTML = `<span class="sync-dot off"></span>Dados salvos só neste navegador`;
    return;
  }
  el.innerHTML = `<span class="sync-dot ${syncState}"></span>${syncMsg}`;
}
function queueSync(){
  dirty = true;
  localStorage.setItem(LS_DATA_KEY, JSON.stringify(state));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{ const ok = await ghPush(false); if (ok) dirty = false; }, 1200);
}
// Ao voltar para a aba/janela, busca a versão mais recente do GitHub automaticamente —
// mas só quando não há nenhuma alteração local ainda não sincronizada (nunca descarta edição em andamento).
function autoRefreshOnFocus(){
  if (githubConfigured() && !dirty){
    ghFetch().then(render);
  }
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible') autoRefreshOnFocus(); });
window.addEventListener('focus', autoRefreshOnFocus);

        pedidos: (parsed.pedidos||[]).map(migratePedido)
      };

  if (!state.materiais.length && !state.impressoras.length && !state.pedidos.length) seedExample();

}

// ==================================================================
// MOTOR DE CÁLCULO
// DADOS → CUSTOS DIRETOS → RISCO → CUSTOS INDIRETOS → CUSTO TOTAL
// → PREÇO MÍNIMO → PREÇO RECOMENDADO → DESCONTOS → MARGENS RESULTANTES
// ==================================================================
function precoGrama(m){ return m.pesoRolo > 0 ? m.precoRolo / m.pesoRolo : 0; }
function custoHoraImpressora(imp){
  const dep = imp.vidaUtil > 0 ? imp.valorAquisicao / imp.vidaUtil : 0;
  const man = imp.horasMes > 0 ? imp.manutencaoMensal / imp.horasMes : 0;
  return { dep, man, total: dep + man };
}
// Comissão do canal escolhido no pedido, consultando o catálogo (aba "Canais de Venda").
// Sem canal definido ou canal removido do catálogo, comissão cai pra 0% — mesmo comportamento
// de antes de canais existirem.
function comissaoDoCanal(canalVendaId, canaisCat){
  canaisCat = canaisCat || [];
  const canal = canaisCat.find(c => c.id === canalVendaId);
  return canal ? (canal.comissao||0) : 0;
}

// Pura: preço a partir de um custo total já fechado + configuração de percentuais.
function computePricing(custoTotal, cfg){
  const somaPerc = (cfg.percImpostos||0)+(cfg.percComissao||0)+(cfg.percMargem||0);
  const percentuaisValidos = somaPerc < 1;
  const denomMin = 1 - (cfg.percImpostos||0) - (cfg.percComissao||0);
  const denomRec = denomMin - (cfg.percMargem||0);
  const precoMinimo = denomMin > 0 ? custoTotal / denomMin : 0;
  const precoRecomendado = (percentuaisValidos && denomRec > 0) ? custoTotal / denomRec : 0;

  function breakdown(preco){
    const impostoV = preco * (cfg.percImpostos||0);
    const comissaoV = preco * (cfg.percComissao||0);
    const lucro = preco - custoTotal - impostoV - comissaoV;
    const margemReal = preco > 0 ? lucro / preco : 0;
    const markup = custoTotal > 0 ? (preco / custoTotal - 1) : 0;
    const abaixoMinimo = preco < precoMinimo - 1e-9;
    return { preco, impostoV, comissaoV, lucro, margemReal, markup, abaixoMinimo };
  }

  const recomendado = breakdown(precoRecomendado);
  const precoPromocional = precoRecomendado * (1 - (cfg.descPromocional||0));
  const promocional = breakdown(precoPromocional);
  const precoAtacado = precoRecomendado * (1 - (cfg.descAtacado||0));
  const atacado = breakdown(precoAtacado);

  return { precoMinimo, recomendado, promocional, atacado, percentuaisValidos };
}

function calcularProducaoLote(p){
  // Sem modo lote (padrão): não existe "fornada" — cada peso/tempo informado já é o total do pedido.
  if (!p.usaLote || !(p.capacidadeFornada > 0)){
    return { usaLote:false, numFornadasCheias:0, restante:0, capacidade:0 };
  }
  const qtd = Math.max(0, p.quantidade||0);
  const capacidade = Math.max(1, Math.floor(p.capacidadeFornada));
  const numFornadasCheias = Math.floor(qtd / capacidade);
  const restante = qtd % capacidade;
  return { usaLote:true, numFornadasCheias, restante, capacidade };
}
function calcPedidoCore(p, cfg, mat, imp, extrasCat, canaisCat, materiaisCat){
  extrasCat = extrasCat || [];
  canaisCat = canaisCat || [];
  materiaisCat = materiaisCat || [];
  const qtd = Math.max(0, p.quantidade||0);
  const producaoLote = calcularProducaoLote(p);

  // ---- material: lista de filamentos usados. Pedidos de antes dessa lista existir (um materialId +
  // um peso só) continuam funcionando automaticamente, sem precisar migrar nada.
  const itensMaterial = (p.materiaisItens && p.materiaisItens.length)
    ? p.materiaisItens
    : [{ lineId:'legacy', materialId: p.materialId||'', peso: p.peso||0 }];

  let pesoTotal = 0;
  let custoMaterial = 0;
  let tempoImpressaoTotal = 0;
  let detalheMateriaisItens;

  if (!producaoLote.usaLote){
    // Sem lote: o peso de cada item já é o total gasto pra produzir o pedido inteiro, e o tempo
    // informado já é o total de impressão — exatamente como o fatiador mostra pra essa leva.
    detalheMateriaisItens = itensMaterial.map(it => {
      const matItem = (it.lineId === 'legacy') ? mat : materiaisCat.find(m => m.id === it.materialId);
      const pesoTotalItem = Math.max(0, it.peso||0);
      const pgItem = matItem ? precoGrama(matItem) : 0;
      const custoItem = pesoTotalItem * pgItem;
      pesoTotal += pesoTotalItem;
      custoMaterial += custoItem;
      return { lineId: it.lineId, materialId: it.materialId, pesoTotalItem, precoGrama: pgItem, custoItem, nome: matItem?matItem.nome:'' };
    });
    tempoImpressaoTotal = Math.max(0, p.tempoImpressao||0);
  } else {
    // Com lote: o peso de cada item e o tempo informados são de UMA FORNADA CHEIA (capacidade
    // peças). O pedido pode precisar de várias fornadas cheias + uma fornada menor no final (ou
    // só uma fornada menor, se a quantidade pedida for menor que a capacidade — caso do rateio:
    // você já produziu uma fornada cheia e está cobrando só a fatia de um cliente).
    // A fornada menor não escala necessariamente na mesma proporção da cheia (purga, brim,
    // aquecimento etc. não caem proporcionalmente) — por isso, se você tiver o peso/tempo REAIS
    // dessa fornada menor (por ter fatiado ela separadamente), informe-os; do contrário, o app
    // estima proporcionalmente a partir da fornada cheia.
    const { numFornadasCheias, restante, capacidade } = producaoLote;
    let pesoFornadaCheiaTotal = 0;
    const detalheFornadaCheia = itensMaterial.map(it => {
      const matItem = (it.lineId === 'legacy') ? mat : materiaisCat.find(m => m.id === it.materialId);
      const pesoItem = Math.max(0, it.peso||0);
      const pgItem = matItem ? precoGrama(matItem) : 0;
      pesoFornadaCheiaTotal += pesoItem;
      return { lineId: it.lineId, materialId: it.materialId, pesoItem, precoGrama: pgItem, nome: matItem?matItem.nome:'' };
    });
    const custoMaterialFornadaCheia = detalheFornadaCheia.reduce((s,d)=>s+d.pesoItem*d.precoGrama, 0);
    const tempoFornadaCheia = Math.max(0, p.tempoImpressao||0);
    const precoMedioGramaFornada = pesoFornadaCheiaTotal>0 ? custoMaterialFornadaCheia/pesoFornadaCheiaTotal : 0;

    const temParcial = restante > 0;
    const pesoParcial = temParcial ? (p.pesoFornadaParcialOverride>0 ? p.pesoFornadaParcialOverride : pesoFornadaCheiaTotal * (restante/capacidade)) : 0;
    const tempoParcial = temParcial ? (p.tempoFornadaParcial>0 ? p.tempoFornadaParcial : tempoFornadaCheia * (restante/capacidade)) : 0;
    const custoMaterialParcial = pesoParcial * precoMedioGramaFornada;

    pesoTotal = pesoFornadaCheiaTotal*numFornadasCheias + pesoParcial;
    tempoImpressaoTotal = tempoFornadaCheia*numFornadasCheias + tempoParcial;
    custoMaterial = custoMaterialFornadaCheia*numFornadasCheias + custoMaterialParcial;

    // Detalhamento por filamento: fornadas cheias contam o peso real; a fatia da fornada parcial
    // é distribuída entre os filamentos na mesma proporção da mistura da fornada cheia.
    detalheMateriaisItens = detalheFornadaCheia.map(d => {
      const parcialItem = pesoFornadaCheiaTotal>0 ? pesoParcial * (d.pesoItem/pesoFornadaCheiaTotal) : 0;
      const pesoTotalItem = d.pesoItem*numFornadasCheias + parcialItem;
      return { lineId: d.lineId, materialId: d.materialId, pesoTotalItem, precoGrama: d.precoGrama, custoItem: pesoTotalItem*d.precoGrama, nome: d.nome };
    });
  }

  // ---- custos diretos ----
  const perdaMaterial = custoMaterial * (cfg.percPerdas||0);
  const custoMaterialFinal = custoMaterial + perdaMaterial;

  const potencia = imp ? imp.potencia : cfg.potenciaPadraoW;
  const custoEnergia = (potencia/1000) * tempoImpressaoTotal * (cfg.precoKWh||0);

  const depHora = imp ? custoHoraImpressora(imp).dep : ((cfg.valorImpressoraPadrao||0)/(cfg.vidaUtilPadrao||1));
  const manHora = imp ? custoHoraImpressora(imp).man : ((cfg.manutencaoMensalPadrao||0)/(cfg.horasMesPadrao||1));
  const custoDepreciacao = tempoImpressaoTotal * depHora;
  const custoManutencao = tempoImpressaoTotal * manHora;
  const custoMaquina = custoDepreciacao + custoManutencao;

  // ---- mão de obra: valor fixo por pedido, sem detalhar tarefa por tarefa ----
  const maoObraTotal = Math.max(0, p.maoObraValor||0);

  // ---- risco de falha/reimpressão (sobre custos produtivos, nunca sobre impostos/comissão/margem) ----
  const custoProdutivoAntesRisco = custoMaterialFinal + custoEnergia + custoMaquina + maoObraTotal;
  const custoRisco = custoProdutivoAntesRisco * (cfg.percFalha||0);
  const custoProdutivoAposRisco = custoProdutivoAntesRisco + custoRisco;

  // ---- embalagens e adicionais (catálogo único "Extras"). "unidade" multiplica pela quantidade
  // escolhida naquele item; "fixo" cobra uma vez só, independente da quantidade informada. ----
  const custoExtrasItens = (p.extrasItens||[]).reduce((soma, it) => {
    const e = extrasCat.find(x => x.id === it.extraId);
    if (!e) return soma;
    const qtdItem = Math.max(0, it.quantidade||0);
    const valorItem = e.tipoCobranca === 'fixo' ? e.valor : e.valor * qtdItem;
    return soma + valorItem;
  }, 0);

  // ---- custos indiretos rateados sobre o tempo de máquina ----
  const custosIndiretos = tempoImpressaoTotal * (cfg.custosIndiretosHora||0);

  // ---- custo total real ----
  const custoTotal = custoProdutivoAposRisco + custoExtrasItens + custosIndiretos;

  // A comissão usada no preço vem do canal de venda escolhido neste pedido, não de um valor
  // único fixo — cada canal (física/Shopee/Mercado Livre) tem sua própria taxa configurada.
  const cfgComComissaoDoCanal = { ...cfg, percComissao: comissaoDoCanal(p.canalVendaId, canaisCat) };
  const pricing = computePricing(custoTotal, cfgComComissaoDoCanal);
  const precoUnitario = qtd > 0 ? pricing.recomendado.preco / qtd : 0;

  return {
    qtd, pesoTotal, tempoImpressaoTotal, producaoLote,
    custoMaterial, perdaMaterial, custoMaterialFinal, detalheMateriaisItens,
    custoEnergia, custoDepreciacao, custoManutencao, custoMaquina,
    maoObraTotal,
    custoProdutivoAntesRisco, custoRisco, custoProdutivoAposRisco,
    custoExtrasItens, custosIndiretos,
    custoTotal, precoUnitario,
    ...pricing
  };
}
function calcPedido(p){
  const cfg = state.config;
  const mat = state.materiais.find(m => m.id === p.materialId);
  const imp = state.impressoras.find(i => i.id === p.impressoraId);
  return calcPedidoCore(p, cfg, mat, imp, state.extras, state.canais, state.materiais);
}

function itensMaterialEfetivos(p){
  return (p.materiaisItens && p.materiaisItens.length) ? p.materiaisItens : (p.materialId ? [{ materialId: p.materialId, peso: p.peso||0 }] : []);
}
function validatePedidoForSave(p, cfg){
  const errs = [];
  if (!(p.quantidade > 0)) errs.push('Informe uma quantidade maior que zero.');
  const itensMat = itensMaterialEfetivos(p);
  if (!itensMat.length) errs.push('Adicione pelo menos um filamento em "Material e impressão".');
  else {
    const somaPesos = itensMat.reduce((s,it)=>s+(it.peso||0),0);
    if (!(somaPesos>0)) errs.push('Informe o peso usado de pelo menos um filamento.');
    itensMat.forEach(it=>{
      const m = state.materiais.find(x=>x.id===it.materialId);
      if (m && (!(m.pesoRolo>0) || !(m.precoRolo>0))) errs.push(`O filamento "${m.nome}" tem peso ou preço do rolo zerado/inválido — corrija em Materiais.`);
    });
  }
  if (!(p.tempoImpressao > 0)) errs.push('Informe o tempo de impressão.');
  if (!p.impressoraId) errs.push('Selecione uma impressora.');
  const mat = state.materiais.find(m=>m.id===p.materialId);
  const imp = state.impressoras.find(i=>i.id===p.impressoraId);
  if (imp && (!(imp.vidaUtil>0) || !(imp.horasMes>0))) errs.push('A impressora selecionada tem vida útil ou horas produtivas/mês zeradas — corrija em Impressoras.');
  const soma = (cfg.percImpostos||0)+comissaoDoCanal(p.canalVendaId, state.canais)+(cfg.percMargem||0);
  if (soma >= 1) errs.push('Impostos + comissão + margem somam 100% ou mais — ajuste em Configurações antes de salvar.');
  if (cfg.impedirPrecoAbaixoMinimo && imp){
    const r = calcPedidoCore(p, cfg, mat, imp, state.extras, state.canais, state.materiais);
    if (r.promocional.abaixoMinimo) errs.push('O preço promocional configurado ficaria abaixo do preço mínimo — ajuste o desconto ou desative essa trava em Configurações.');
    if (r.atacado.abaixoMinimo) errs.push('O preço de atacado configurado ficaria abaixo do preço mínimo — ajuste o desconto ou desative essa trava em Configurações.');
  }
  return errs;
}
function pedidoWarnings(p){
  const warns = [];
  const itensMat = itensMaterialEfetivos(p);
  if (p.quantidade > 0){
    const somaPesos = itensMat.reduce((s,it)=>s+(it.peso||0),0);
    if (!itensMat.length) warns.push('Nenhum filamento adicionado — o custo de material não está sendo considerado.');
    else if (!(somaPesos>0)) warns.push('Peso está zerado — o custo de material não está sendo considerado.');
    if (!(p.tempoImpressao > 0)) warns.push('Tempo de impressão está zerado — energia e custo de máquina não estão sendo considerados.');
  }
  if (p.usaLote && !(p.capacidadeFornada > 0)) warns.push('Produção em fornadas está marcada, mas a capacidade da fornada está zerada — informe quantas peças cabem numa fornada cheia.');
  itensMat.forEach(it=>{
    const m = state.materiais.find(x=>x.id===it.materialId);
    if (m && (!(m.pesoRolo>0) || !(m.precoRolo>0))) warns.push(`O filamento "${m.nome}" tem peso ou preço do rolo inválido — corrija em Materiais.`);
  });
  const imp = state.impressoras.find(i=>i.id===p.impressoraId);
  if (imp && (!(imp.vidaUtil>0) || !(imp.horasMes>0))) warns.push('A impressora selecionada tem vida útil ou horas produtivas/mês inválidas — corrija em Impressoras.');
  return warns;
}

function pedidoTeste(overrides){
  return {
    quantidade:1, materialId:'', peso:0, materiaisItens:[], impressoraId:'', tempoImpressao:0,
    maoObraValor:0, extrasItens:[], canalVendaId:'',

  };
}
function runSelfTests(){
  const out = [];
  const push = (name, pass, detail) => out.push({ name, pass, detail });

  // Teste 1 — preço recomendado
  {
    const cfg = { ...DEFAULT_CONFIG, percImpostos:0.06, percComissao:0, percMargem:0.30 };
    const r = computePricing(100, cfg);
    push('Teste 1 — Preço recomendado (custo 100, imposto 6%, margem 30%)',
      Math.abs(r.recomendado.preco - 156.25) < 0.01,
      `esperado R$156,25 — obtido R$${r.recomendado.preco.toFixed(2)}`);

    // Teste 2 — margem real
    push('Teste 2 — Margem líquida real do preço recomendado = 30%',
      Math.abs(r.recomendado.margemReal - 0.30) < 0.001,
      `obtido ${(r.recomendado.margemReal*100).toFixed(2)}%`);

    // Teste 3 — desconto promocional reduz margem
    push('Teste 3 — Desconto promocional reduz a margem líquida',
      r.promocional.margemReal < r.recomendado.margemReal,
      `recomendada ${(r.recomendado.margemReal*100).toFixed(1)}% vs promocional ${(r.promocional.margemReal*100).toFixed(1)}%`);
  }

  // Teste 4 — alerta de preço abaixo do mínimo
  {
    const cfg = { ...DEFAULT_CONFIG, percImpostos:0.06, percComissao:0, percMargem:0.30, descPromocional:0.90 };
    const r = computePricing(100, cfg);
    push('Teste 4 — Preço abaixo do mínimo gera alerta',
      r.promocional.abaixoMinimo === true,
      `preço promocional R$${r.promocional.preco.toFixed(2)} vs mínimo R$${r.precoMinimo.toFixed(2)}`);
  }

  // Teste 5 — peso total é a soma dos filamentos da lista, SEM multiplicar por quantidade
  // (peso já é o total gasto pra produzir o pedido inteiro, do jeito que o fatiador mostra)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const materiaisCat = [{ id:'m1', pesoRolo:1000, precoRolo:100 }, { id:'m2', pesoRolo:1000, precoRolo:200 }];
    const p = pedidoTeste({ quantidade:10, materiaisItens:[{ lineId:'a', materialId:'m1', peso:80 }, { lineId:'b', materialId:'m2', peso:20 }] });
    const r = calcPedidoCore(p, cfg, null, null, [], [], materiaisCat);
    push('Teste 5 — Peso total = soma dos itens (80g+20g=100g), não multiplica pela quantidade (10)',
      Math.abs(r.pesoTotal - 100) < 0.01,
      `pesoTotal = ${r.pesoTotal.toFixed(0)}g (esperado 100g, NUNCA 1000g)`);
    push('Teste 5b — Custo de material = 80×0,10 + 20×0,20 = 12,00',
      Math.abs(r.custoMaterial - 12) < 0.01,
      `custoMaterial = R$${r.custoMaterial.toFixed(2)} (esperado R$12,00)`);
  }

  // Teste 6 — tempo de impressão total é o valor informado diretamente, sem multiplicar por quantidade
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:15, tempoImpressao:3 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 6 — Tempo de impressão total = valor informado (3h), não multiplica por quantidade (15)',
      Math.abs(r.tempoImpressaoTotal - 3) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 3h, NUNCA 45h)`);
  }

  // Teste 7 — mão de obra é um valor fixo, entra certinho no custo produtivo
  {
    const cfg = { ...DEFAULT_CONFIG, percFalha:0, percPerdas:0, custosIndiretosHora:0 };
    const p = pedidoTeste({ quantidade:1, maoObraValor:37.5 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 7 — Mão de obra fixa (R$37,50) entra no custo produtivo sem alterações',
      Math.abs(r.maoObraTotal - 37.5) < 0.001 && Math.abs(r.custoProdutivoAntesRisco - 37.5) < 0.001,
      `maoObraTotal = R$${r.maoObraTotal.toFixed(2)} (esperado R$37,50)`);
  }

  // Teste 8 — risco de falha aplicado só sobre material+energia+máquina+mão de obra (nunca sobre extras/indiretos)
  {
    const cfg = { ...DEFAULT_CONFIG, percFalha:0.05, percPerdas:0, custosIndiretosHora:100 };
    const mat = { pesoRolo:1000, precoRolo:100 }; // R$0,10/g
    const extrasCat = [{ id:'caixa', nome:'Caixa', valor:1000, tipoCobranca:'fixo' }]; // valor exagerado de propósito p/ o teste
    const p = pedidoTeste({ quantidade:1, materialId:'m', peso:1000, maoObraValor:0, extrasItens:[{ lineId:'x', extraId:'caixa', quantidade:1 }] });
    const r = calcPedidoCore(p, cfg, mat, null, extrasCat);
    push('Teste 8 — Risco de falha (5%) incide só sobre custo produtivo (R$100 material), não sobre extras/indiretos',
      Math.abs(r.custoRisco - 5) < 0.01,
      `custoRisco = R$${r.custoRisco.toFixed(2)} (esperado R$5,00 — 5% de R$100 de material, ignorando os R$1000 de extras)`);
  }

  // Teste 9 — extras: "fixo" cobra uma vez só; "unidade" multiplica pela quantidade do item
  {
    const cfg = { ...DEFAULT_CONFIG, percFalha:0, percPerdas:0, custosIndiretosHora:0 };
    const extrasCat = [
      { id:'caixa', nome:'Caixa', valor:3, tipoCobranca:'unidade' },
      { id:'garantia', nome:'Garantia', valor:10, tipoCobranca:'fixo' },
    ];
    const p = pedidoTeste({ quantidade:1, extrasItens:[{ lineId:'a', extraId:'caixa', quantidade:4 }, { lineId:'b', extraId:'garantia', quantidade:1 }] });
    const r = calcPedidoCore(p, cfg, null, null, extrasCat);
    push('Teste 9 — Extras: 4 caixas a R$3 (unidade) + garantia fixa R$10 = R$22',
      Math.abs(r.custoExtrasItens - 22) < 0.01,
      `custoExtrasItens = R$${r.custoExtrasItens.toFixed(2)} (esperado R$22,00)`);
  }

  // Teste 10 — comissão do canal de venda escolhido é a que entra no preço
  {
    const cfg = { ...DEFAULT_CONFIG, percImpostos:0, percMargem:0 };
    const canaisCat = [{ id:'shopee', nome:'Shopee', comissao:0.20 }];
    const p = pedidoTeste({ quantidade:1, canalVendaId:'shopee', maoObraValor:50 });
    const r = calcPedidoCore(p, cfg, null, null, [], canaisCat);
    push('Teste 10 — Comissão do canal (Shopee 20%) aplicada no preço recomendado',
      Math.abs(r.recomendado.comissaoV / r.recomendado.preco - 0.20) < 0.001,
      `comissão proporcional obtida ${((r.recomendado.comissaoV/r.recomendado.preco)*100).toFixed(1)}% (esperado 20%)`);
  }

  // Teste 11 — preço unitário = preço total recomendado ÷ quantidade
  {
    const cfg = { ...DEFAULT_CONFIG };
    const mat = { pesoRolo:1000, precoRolo:100 };
    const p = pedidoTeste({ quantidade:4, materialId:'m', peso:400, tempoImpressao:2 });
    const r = calcPedidoCore(p, cfg, mat, null);
    push('Teste 11 — Preço unitário = preço total ÷ quantidade',
      Math.abs(r.precoUnitario - r.recomendado.preco/4) < 0.001,
      `precoUnitario = R$${r.precoUnitario.toFixed(2)} vs total/4 = R$${(r.recomendado.preco/4).toFixed(2)}`);
  }

  // Teste 12 — modelo legado (materialId + peso direto, sem materiaisItens) continua funcionando
  {
    const cfg = { ...DEFAULT_CONFIG, percPerdas:0 };
    const mat = { pesoRolo:1000, precoRolo:100 };
    const p = pedidoTeste({ quantidade:1, materialId:'m-legado', peso:250 });
    const r = calcPedidoCore(p, cfg, mat, null);
    push('Teste 12 — Pedido no formato antigo (um material + um peso) calcula igual antes',
      Math.abs(r.pesoTotal - 250) < 0.01 && Math.abs(r.custoMaterial - 25) < 0.01,
      `pesoTotal = ${r.pesoTotal.toFixed(0)}g, custoMaterial = R$${r.custoMaterial.toFixed(2)} (esperado 250g / R$25,00)`);
  }

  // Teste 13 — rateio de lote: fornada cheia de 15 peças, cliente quer só 5 (sem imprimir de novo)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const materiaisCat = [{ id:'m1', pesoRolo:1000, precoRolo:100 }]; // R$0,10/g
    const p = pedidoTeste({ quantidade:5, usaLote:true, capacidadeFornada:15, tempoImpressao:3,
      materiaisItens:[{ lineId:'a', materialId:'m1', peso:150 }] });
    const r = calcPedidoCore(p, cfg, null, null, [], [], materiaisCat);
    push('Teste 13 — Rateio de lote (fornada de 15, cliente quer 5): peso e tempo proporcionais',
      Math.abs(r.pesoTotal - 50) < 0.01 && Math.abs(r.tempoImpressaoTotal - 1) < 0.01,
      `pesoTotal=${r.pesoTotal}g (esp. 50g), tempoTotal=${r.tempoImpressaoTotal}h (esp. 1h)`);
  }

  // Teste 14 — múltiplas fornadas cheias + fornada parcial, SEM override (estimativa proporcional)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const materiaisCat = [{ id:'m1', pesoRolo:1000, precoRolo:100 }];
    const p = pedidoTeste({ quantidade:25, usaLote:true, capacidadeFornada:10, tempoImpressao:2,

    const r = calcPedidoCore(p, cfg, null, null, [], [], materiaisCat);
    push('Teste 14 — 25 peças / fornada de 10 / sem override: 2 fornadas cheias + 1 parcial estimada',

      `fornadas=${r.producaoLote.numFornadasCheias}, restante=${r.producaoLote.restante}, pesoTotal=${r.pesoTotal}g (esp. 300g), tempoTotal=${r.tempoImpressaoTotal}h (esp. 5h)`);

  // Teste 15 — mesma coisa, mas COM peso/tempo reais da fornada parcial (não deve usar a estimativa proporcional)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const materiaisCat = [{ id:'m1', pesoRolo:1000, precoRolo:100 }];
    const p = pedidoTeste({ quantidade:25, usaLote:true, capacidadeFornada:10, tempoImpressao:2,
      materiaisItens:[{ lineId:'a', materialId:'m1', peso:120 }],
      pesoFornadaParcialOverride:70, tempoFornadaParcial:1.3 });
    const r = calcPedidoCore(p, cfg, null, null, [], [], materiaisCat);
    push('Teste 15 — Fornada parcial com valores reais informados (70g/1,3h) ignora a estimativa proporcional (60g/1h)',
      Math.abs(r.pesoTotal - 310) < 0.01 && Math.abs(r.tempoImpressaoTotal - 5.3) < 0.01,
      `pesoTotal=${r.pesoTotal}g (esp. 310g, NUNCA 300g), tempoTotal=${r.tempoImpressaoTotal}h (esp. 5,3h, NUNCA 5h)`);
  }

  // Teste 16 — modo lote desligado continua exatamente como o modelo simples (sem fornadas)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const materiaisCat = [{ id:'m1', pesoRolo:1000, precoRolo:100 }];
    const p = pedidoTeste({ quantidade:10, materiaisItens:[{ lineId:'a', materialId:'m1', peso:80 }], tempoImpressao:2 });
    const r = calcPedidoCore(p, cfg, null, null, [], [], materiaisCat);
    push('Teste 16 — Sem modo lote: peso/tempo continuam sendo o total informado, sem multiplicar por quantidade',
      Math.abs(r.pesoTotal - 80) < 0.01 && Math.abs(r.tempoImpressaoTotal - 2) < 0.01,
      `pesoTotal=${r.pesoTotal}g (esp. 80g), tempoTotal=${r.tempoImpressaoTotal}h (esp. 2h)`);
  }

  return out;
}

// Campos de tempo do pedido são editados em dias/horas/minutos, mas continuam guardados
// e usados internamente como horas decimais — o motor de cálculo não muda em nada.
function decompDHM(decimalHoras){
  const totalMin = Math.round(Math.max(0, decimalHoras||0) * 60);
  const dias = Math.floor(totalMin / (24*60));
  const restoAposDias = totalMin % (24*60);
  const horas = Math.floor(restoAposDias / 60);
  const minutos = restoAposDias % 60;
  return { dias, horas, minutos };
}
function composeDHM(dias, horas, minutos){
  return (Math.max(0,dias||0)*24) + Math.max(0,horas||0) + (Math.max(0,minutos||0)/60);
}
function fieldDHM(key, label){
  const { dias, horas, minutos } = decompDHM(draft[key]);
  return `<div class="field">
    <label>${label}</label>
    <div class="dhm-group">
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="d" value="${dias}"><span>d</span></div>
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="h" value="${horas}"><span>h</span></div>
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="m" value="${minutos}"><span>min</span></div>
    </div>
  </div>`;
}

            <div class="line"><span>Preço mínimo — sem margem</span><span>${fmtR(r.precoMinimo)}</span></div>

            <div class="line"><span>Lucro líquido</span><span>${fmtR(r.recomendado.lucro)}</span></div>

            <div class="line"><span>Preço atacado / peça</span><span>${fmtR(r.qtd>0 ? r.atacado.preco/r.qtd : 0)}</span></div>

            ${alertaAbaixoMinimo(r.atacado)}

        </div></div></div>`;
}
function viewListaPedidos(){

      <td class="num">${p.quantidade}</td><td class="num mono">${fmtR(r.custoTotal)}</td>

function viewTestes(){
  const results = runSelfTests();
  const allPass = results.every(r=>r.pass);
  const rows = results.map(r=>`<tr><td>${r.name}</td><td style="font-size:12px;color:var(--ink-soft)">${r.detail}</td>
    <td><span class="badge ${r.pass?'fin':'can'}">${r.pass?'PASSOU':'FALHOU'}</span></td></tr>`).join('');
  return `<h1>Testes automáticos</h1><p class="lead">Verificações internas da lógica de precificação — rodam sempre que você abre esta aba.</p>
    <div class="tag-note ${allPass?'info':'err'}">${allPass ? '✅ Todos os testes passaram.' : '⚠️ Um ou mais testes falharam — revise a lógica antes de confiar nos preços.'}</div>
    <div class="card"><table><thead><tr><th>Teste</th><th>Detalhe</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

        <li>Vá em <code>Settings → Pages</code> desse repositório → "Deploy from a branch" → <code>main</code> → <code>/root</code>. Em 1-2 min você tem um link tipo <code>https://seu-usuario.github.io/028labs-calculadora/</code>.</li>
        <li><strong>Repositório 2 — privado, só os dados:</strong> crie outro repositório (ex: <code>028labs-dados</code>) e marque como <strong>Private</strong>. Pode ficar vazio — o app cria o <code>data.json</code> sozinho no primeiro salvamento.</li>

// ---------- events ----------
function bindEvents(){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; if(tab==='novo' && !editingPedidoId) draft=null; formErrors=[]; render(); };
  });
  const themeBtn = document.getElementById('theme-toggle');
  if (themeBtn) themeBtn.onclick = ()=>{ theme = theme==='dark' ? 'light' : 'dark'; localStorage.setItem('028labs_theme', theme); applyTheme(); renderNav(); };
  const themeBtnMobile = document.getElementById('theme-toggle-mobile');
  if (themeBtnMobile) themeBtnMobile.onclick = ()=>{ theme = theme==='dark' ? 'light' : 'dark'; localStorage.setItem('028labs_theme', theme); applyTheme(); renderNav(); };
  document.querySelectorAll('#mobile-nav [data-tab]').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; moreOpen=false; if(tab==='novo' && !editingPedidoId) draft=null; formErrors=[]; render(); };
  });
  const moreBtn = document.getElementById('mnav-more');
  if (moreBtn) moreBtn.onclick = ()=>{ moreOpen = !moreOpen; renderNav(); };
  document.querySelectorAll('#mobile-more-sheet [data-tab]').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; moreOpen=false; if(tab==='novo' && !editingPedidoId) draft=null; formErrors=[]; render(); };
  });
  document.querySelectorAll('[data-cfg]').forEach(el=>{
    el.onchange = ()=>{ state.config[el.dataset.cfg] = parseFloat(el.value)||0; queueSync(); render(); };
  });
  document.querySelectorAll('[data-cfgbool]').forEach(el=>{
    el.onchange = ()=>{ state.config[el.dataset.cfgbool] = el.checked; queueSync(); render(); };
  });
  const compraSelect = document.getElementById('compra-select');
  if (compraSelect) compraSelect.onchange = ()=>{
    compraSelecionada = compraSelect.value;
    compraDraft = compraDraftPadrao(compraSelecionada==='__novo__' ? null : state.materiais.find(m=>m.id===compraSelecionada));
    render();
  };
  const registrarCompra = document.getElementById('registrar-compra');
  if (registrarCompra) registrarCompra.onclick = ()=>{
    const nome = document.getElementById('compra-nome').value.trim();
    const marca = document.getElementById('compra-marca').value.trim();
    const tipo = document.getElementById('compra-tipo').value.trim();
    const pesoRolo = Math.max(0, parseFloat(document.getElementById('compra-peso').value)||0);
    const precoRolo = Math.max(0, parseFloat(document.getElementById('compra-preco').value)||0);
    const fornecedor = document.getElementById('compra-fornecedor').value.trim();
    const dataCompra = document.getElementById('compra-data').value;
    const ehNovo = compraSelecionada==='' || compraSelecionada==='__novo__';
    if (ehNovo){
      if (!nome){ return; } // nome é o mínimo indispensável pra um filamento novo
      state.materiais.push({ id: uid(), nome, marca, tipo, pesoRolo, precoRolo, fornecedor, dataUltimaCompra: dataCompra, historico: [] });
    } else {
      const m = state.materiais.find(x=>x.id===compraSelecionada);
      if (m){
        // Só entra no histórico se algo realmente mudou desde a última compra registrada.
        if (m.precoRolo !== precoRolo || (m.fornecedor||'') !== fornecedor){
          m.historico = m.historico || [];
          m.historico.push({ data: m.dataUltimaCompra||'', fornecedor: m.fornecedor||'', precoRolo: m.precoRolo });
        }
        m.pesoRolo = pesoRolo; m.precoRolo = precoRolo; m.fornecedor = fornecedor; m.dataUltimaCompra = dataCompra;
      }
    }
    queueSync();
    compraSelecionada = ''; compraDraft = null;
    render();
  };
  document.querySelectorAll('[data-mat]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const m = state.materiais.find(x=>x.id===id); const k = el.dataset.mat;
      const novoValor = (k==='pesoRolo'||k==='precoRolo') ? Math.max(0,parseFloat(el.value)||0) : el.value;
      // Editar o preço direto na tabela também conta como uma nova compra — guarda o valor anterior no histórico.
      if (k==='precoRolo' && novoValor !== m.precoRolo){
        m.historico = m.historico || [];
        m.historico.push({ data: m.dataUltimaCompra||'', fornecedor: m.fornecedor||'', precoRolo: m.precoRolo });
        m.dataUltimaCompra = new Date().toISOString().slice(0,10);
      }
      m[k] = novoValor; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-mat]').forEach(el=>{
    el.onclick = ()=>{ state.materiais = state.materiais.filter(m=>m.id!==el.dataset.delMat); queueSync(); render(); };
  });
  const addImp = document.getElementById('add-imp');
  if (addImp) addImp.onclick = ()=>{ state.impressoras.push({ id:uid(), nome:'Nova impressora', modelo:'', valorAquisicao:0, vidaUtil:8000, potencia:120, manutencaoMensal:0, horasMes:150 }); queueSync(); render(); };
  document.querySelectorAll('[data-imp]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const i = state.impressoras.find(x=>x.id===id); const k = el.dataset.imp;
      i[k] = (k==='nome'||k==='modelo') ? el.value : Math.max(0,parseFloat(el.value)||0); queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-imp]').forEach(el=>{
    el.onclick = ()=>{ state.impressoras = state.impressoras.filter(i=>i.id!==el.dataset.delImp); queueSync(); render(); };
  });
  const addExt = document.getElementById('add-ext');
  if (addExt) addExt.onclick = ()=>{ state.extras.push({ id:uid(), nome:'Novo item', valor:0, tipoCobranca:'unidade' }); queueSync(); render(); };
  document.querySelectorAll('[data-ext]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const e = state.extras.find(x=>x.id===id); const k = el.dataset.ext;
      e[k] = (k==='valor') ? Math.max(0,parseFloat(el.value)||0) : el.value; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-ext]').forEach(el=>{
    el.onclick = ()=>{ state.extras = state.extras.filter(e=>e.id!==el.dataset.delExt); queueSync(); render(); };
  });
  const addCanal = document.getElementById('add-canal');
  if (addCanal) addCanal.onclick = ()=>{ state.canais.push({ id:uid(), nome:'Novo canal', comissao:0 }); queueSync(); render(); };
  document.querySelectorAll('[data-cancat]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const ch = state.canais.find(x=>x.id===id); const k = el.dataset.cancat;
      ch[k] = (k==='comissao') ? Math.max(0,parseFloat(el.value)||0) : el.value; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-cancat]').forEach(el=>{
    el.onclick = ()=>{ state.canais = state.canais.filter(ch=>ch.id!==el.dataset.delCancat); queueSync(); render(); };
  });
  document.querySelectorAll('[data-dhm]').forEach(el=>{
    el.onchange = ()=>{
      const key = el.dataset.dhm;
      const cur = decompDHM(draft[key]);
      const v = Math.max(0, parseFloat(el.value)||0);
      if (el.dataset.dhmU === 'd') cur.dias = v;
      else if (el.dataset.dhmU === 'h') cur.horas = v;
      else cur.minutos = v;
      draft[key] = composeDHM(cur.dias, cur.horas, cur.minutos);
      render();
    };
  });
  document.querySelectorAll('[data-p]').forEach(el=>{
    el.onchange = ()=>{ const k = el.dataset.p;
      const textKeys = ['data','cliente','produto','status','materialId','impressoraId','canalVendaId'];
      draft[k] = textKeys.includes(k) ? el.value : Math.max(0, parseFloat(el.value)||0);
      render(); };
  });
  document.querySelectorAll('[data-p-bool]').forEach(el=>{
    el.onchange = ()=>{ draft[el.dataset.pBool] = el.checked; render(); };
  });
  const addMatItem = document.getElementById('add-matitem');
  if (addMatItem) addMatItem.onclick = ()=>{
    const materialId = document.getElementById('add-matitem-select').value;
    const peso = Math.max(0, parseFloat(document.getElementById('add-matitem-peso').value)||0);
    draft.materiaisItens.push({ lineId:uid(), materialId, peso });
    render();
  };
  document.querySelectorAll('[data-matitem-peso]').forEach(el=>{
    el.onchange = ()=>{ const it = draft.materiaisItens.find(x=>x.lineId===el.dataset.matitemPeso);
      if (it) it.peso = Math.max(0, parseFloat(el.value)||0); render(); };
  });
  document.querySelectorAll('[data-del-matitem]').forEach(el=>{
    el.onclick = ()=>{ draft.materiaisItens = draft.materiaisItens.filter(x=>x.lineId!==el.dataset.delMatitem); render(); };
  });
  const addExtItem = document.getElementById('add-ext-item');
  if (addExtItem) addExtItem.onclick = ()=>{
    const extraId = document.getElementById('add-ext-select').value;
    const quantidade = Math.max(1, parseFloat(document.getElementById('add-ext-qtd').value)||1);
    draft.extrasItens.push({ lineId:uid(), extraId, quantidade });
    render();
  };
  document.querySelectorAll('[data-ext-item-qtd]').forEach(el=>{
    el.onchange = ()=>{ const it = draft.extrasItens.find(x=>x.lineId===el.dataset.extItemQtd);
      if (it) it.quantidade = Math.max(1, parseFloat(el.value)||1); render(); };
  });
  document.querySelectorAll('[data-del-ext-item]').forEach(el=>{
    el.onclick = ()=>{ draft.extrasItens = draft.extrasItens.filter(x=>x.lineId!==el.dataset.delExtItem); render(); };
  });
  const saveBtn = document.getElementById('save-pedido');
  if (saveBtn) saveBtn.onclick = ()=>{
    formErrors = validatePedidoForSave(draft, state.config);
    if (formErrors.length){ render(); return; }
    if (editingPedidoId){ const idx = state.pedidos.findIndex(p=>p.id===editingPedidoId); state.pedidos[idx] = { ...draft, id: editingPedidoId }; }
    else { state.pedidos.push({ ...draft, id: uid() }); }
    queueSync(); editingPedidoId = null; draft = null; formErrors = []; tab='lista'; render();
  };
  const cancelBtn = document.getElementById('cancel-pedido');
  if (cancelBtn) cancelBtn.onclick = ()=>{ editingPedidoId=null; draft=null; formErrors=[]; tab='lista'; render(); };
  const gerarPdfBtn = document.getElementById('gerar-pdf');
  if (gerarPdfBtn) gerarPdfBtn.onclick = ()=>{ gerarPdfPedido(draft); };
  document.querySelectorAll('[data-pdf-pedido]').forEach(el=>{
    el.onclick = ()=>{ const p = state.pedidos.find(x=>x.id===el.dataset.pdfPedido); if (p) gerarPdfPedido(p); };
  });
  document.querySelectorAll('[data-edit-pedido]').forEach(el=>{
    el.onclick = ()=>{ editingPedidoId = el.dataset.editPedido; draft = null; formErrors=[]; tab='novo'; render(); };
  });
  document.querySelectorAll('[data-del-pedido]').forEach(el=>{
    el.onclick = ()=>{ state.pedidos = state.pedidos.filter(p=>p.id!==el.dataset.delPedido); queueSync(); render(); };
  });
  const ghSave = document.getElementById('gh-save');
  if (ghSave) ghSave.onclick = async ()=>{
    github.owner = document.getElementById('gh-owner').value.trim();
    github.repo = document.getElementById('gh-repo').value.trim();
    github.branch = document.getElementById('gh-branch').value.trim() || 'main';
    github.path = document.getElementById('gh-path').value.trim() || 'data.json';
    github.token = document.getElementById('gh-token').value.trim();
    saveSettings();
    // Nunca sobrescreve o estado local aqui: só obtém o SHA remoto (se existir) e
    // então grava o estado local atual. O estado local nunca é descartado.
    setSync('busy','Conectando ao GitHub…');
    try{
      ghSha = await ghGetLatestSha();
    } catch(e){
      setSync('err', 'Falha ao conectar ao GitHub: ' + e.message);
      render();
      return;
    }
    await ghPush(false);
    render();
  };
  const ghTest = document.getElementById('gh-test');
  if (ghTest) ghTest.onclick = async ()=>{
    const owner = document.getElementById('gh-owner').value.trim();
    const repo = document.getElementById('gh-repo').value.trim();
    const token = document.getElementById('gh-token').value.trim();
    setSync('busy','Testando…');
    try{
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers:{ Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`Resposta ${res.status}`);
      setSync('ok','Conexão OK — repositório encontrado.');
    } catch(e){ setSync('err','Erro: ' + e.message); }
  };
  const ghCopyLink = document.getElementById('gh-copy-link');
  if (ghCopyLink) ghCopyLink.onclick = async ()=>{
    const link = document.getElementById('gh-quicklink').value;
    try{
      await navigator.clipboard.writeText(link);
      ghCopyLink.textContent = 'Copiado!';
      setTimeout(()=>{ ghCopyLink.textContent = 'Copiar link'; }, 1500);
    } catch(e){
      document.getElementById('gh-quicklink').select();
    }
  };
}

init();

</script>
</body>
</html>
