<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>028Labs — Calculadora de Precificação</title>
<style>
  :root{
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1c1b19;
    --ink-soft: #5a564e;
    --line: #e4e1d8;
    --accent: #e8590c;
    --accent-dark: #b8430a;
    --accent-soft: #fdeee3;
    --locked-bg: #f1f0ec;
    --locked-text: #6b6860;
    --ok: #2f7d4f;
    --danger: #b3261e;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .shell{display:flex; min-height:100vh;}
  .side{
    width:220px; flex-shrink:0; background:#1c1b19; color:#f6f5f1;
    padding:28px 0; display:flex; flex-direction:column;
  }
  .brand{padding:0 20px 24px; border-bottom:1px solid #33312c; margin-bottom:12px;}
  .brand-logo{display:block; width:150px; max-width:100%; height:auto; margin:0 0 14px;}
  .brand .sub{font-size:12px; color:#93908a; margin-top:4px;}
  nav{display:flex; flex-direction:column; gap:2px; padding:0 10px;}
  nav button{
    all:unset; cursor:pointer; padding:11px 14px; border-radius:6px; font-size:14px;
    color:#c9c6bf; transition:background .12s, color .12s;
  }
  nav button:hover{background:#2a2925; color:#fff;}
  nav button.active{background:var(--accent); color:#fff; font-weight:600;}
  .side-foot{margin-top:auto; padding:16px 20px 0; font-size:11px; border-top:1px solid #33312c;}
  .sync-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px;}
  .sync-dot.ok{background:#3fb56e;}
  .sync-dot.busy{background:#e8a83c; animation:pulse 1s infinite;}
  .sync-dot.err{background:#e0574c;}
  .sync-dot.off{background:#6b6860;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  main{flex:1; padding:32px 40px; max-width:1180px;}
  h1{font-size:24px; margin:0 0 4px;}
  .lead{color:var(--ink-soft); font-size:14px; margin:0 0 28px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 24px; margin-bottom:20px;}
  .card h2{font-size:15px; margin:0 0 4px; font-weight:700;}
  .card summary::-webkit-details-marker{display:none;}
  .card summary::marker{content:'';}
  details.card[open] summary{border-bottom:1px solid var(--line); margin-bottom:0;}
  .card .card-note{font-size:12.5px; color:var(--ink-soft); margin:0 0 18px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  input, select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-family:var(--sans); font-size:13.5px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .field{margin-bottom:0;}
  .field.locked input{background:var(--locked-bg); color:var(--locked-text); border-color:var(--line);}
  .dhm-group{display:flex; gap:6px;}
  .dhm-item{flex:1; display:flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:6px; padding:0 8px; background:#fff;}
  .dhm-item input{border:none; padding:8px 0; width:100%; text-align:right;}
  .dhm-item span{font-size:11px; color:var(--ink-soft); flex-shrink:0;}
  .field.locked label{display:flex; align-items:center; gap:5px;}
  .lock-tag{font-size:9px; background:var(--locked-bg); color:var(--locked-text); padding:1px 5px; border-radius:3px; font-weight:700; letter-spacing:.03em;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:700;}
  td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--mono);}
  .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .btn{all:unset; cursor:pointer; padding:9px 16px; border-radius:6px; font-size:13.5px; font-weight:600; background:var(--accent); color:#fff; transition:background .12s;}
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn.ghost:hover{background:#f0efea;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid #e6b3ae;}
  .btn.danger:hover{background:#fbeceb;}
  .row-actions{display:flex; gap:6px;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .empty{padding:26px; text-align:center; color:var(--ink-soft); font-size:13.5px;}
  .badge{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:700;}
  .badge.orc{background:#eee7d8; color:#7a6a2c;}
  .badge.apr{background:#e2ecfb; color:#2a5b9c;}
  .badge.prod{background:#f4e3c7; color:#8a5a10;}
  .badge.fin{background:#dcefe1; color:#256d3c;}
  .badge.ent{background:#d8f0e3; color:#1c7a45;}
  .badge.can{background:#f5dcda; color:#a33128;}
  .result-strip{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .result-cell{padding:16px 18px; border-bottom:1px solid var(--line);}
  .result-cell:last-child{border-bottom:none;}
  .result-cell .k{font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .result-cell .v{font-family:var(--mono); font-size:19px; font-weight:700;}
  .result-cell.hero{background:var(--accent); color:#fff;}
  .result-cell.hero .k{color:#ffe2ce;}
  .breakdown{display:grid; grid-template-columns:1fr; gap:0; margin-top:14px; font-size:13px;}
  .breakdown .line{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line);}
  .breakdown .line span:first-child{color:var(--ink-soft);}
  .breakdown .line span:last-child{font-family:var(--mono);}
  .two-col{display:grid; grid-template-columns:2fr 1fr; gap:20px; align-items:start;}
  .tag-note{background:var(--accent-soft); border:1px solid #f6c9a8; color:#8a4318; font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:18px;}
  .tag-note.info{background:#eef3fb; border-color:#c3d6f0; color:#2a4d7c;}
  .tag-note.err{background:#fbecea; border-color:#eab7ae; color:#8a2f22;}
  code{background:var(--locked-bg); padding:1px 6px; border-radius:4px; font-family:var(--mono); font-size:12px;}
  ol.steps{padding-left:20px; font-size:13.5px; line-height:1.8;}
  @media (max-width:880px){
    .shell{flex-direction:column;}
    .side{width:100%; flex-direction:row; overflow-x:auto; padding:14px;}
    .brand{display:none;}
    nav{flex-direction:row;}
    main{padding:20px;}
    .two-col{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
const LS_SETTINGS_KEY = '028labs_github_settings';
const LS_DATA_KEY = '028labs_local_cache';

// Valores iniciais de referência para uma pequena operação de impressão 3D
// em Nova Venécia — ES, com Bambu Lab A1 como impressora principal.
// São só um ponto de partida: tudo aqui é editável na aba Configurações.
const DEFAULT_CONFIG = {
  // Energia — valor de referência inicial, não é tarifa oficial fixa.
  // Ajuste pelo valor efetivamente pago na sua conta de luz.
  precoKWh: 0.95,

  // Impressora padrão (usado só quando um pedido não tem impressora selecionada) — Bambu Lab A1.
  // 95W é consumo médio de impressão, NÃO a potência máxima da fonte (1300W@220V / 350W@110V é pico, não uso contínuo).
  potenciaPadraoW: 95,
  valorImpressoraPadrao: 3500, // preço de referência da A1 no Brasil — varia por loja/promoção/frete/AMS Lite
  vidaUtilPadrao: 8000,        // premissa de rateio de depreciação, não uma garantia de vida útil real
  manutencaoMensalPadrao: 50,
  horasMesPadrao: 180,         // ~6h/dia x 30 dias — parâmetro de rateio, não promessa de uso constante

  // Mão de obra e serviços
  maoObraHora: 25,        // referência inicial para produção física (preparação, acabamento, montagem etc.)
  tarifaProjetoHora: 40,  // trabalho técnico de projeto/modelagem vale mais que a hora de produção

  // Custos indiretos / overhead — rateio de despesas administrativas (internet, software, espaço etc.),
  // nunca duplica energia, depreciação, manutenção ou material, que já são calculados à parte.
  custosIndiretosHora: 10,

  // Perdas e risco — reservas médias, não previsão exata por peça
  percPerdas: 0.05,  // 5% de perda de material (purgas, suportes, brim, sobras)
  percFalha: 0.03,   // 3% de reserva para falhas/reimpressões (não é previsão de que 3% das peças vão falhar)

  // Tributação / margem — estimativas iniciais, ajuste conforme seu regime tributário e canal de venda
  percImpostos: 0.06,
  percMargem: 0.30,
  percComissao: 0, // fica zerado por padrão pois depende do canal de venda (marketplace, cartão, intermediário etc.)

  // Embalagens são cadastradas e escolhidas por item no próprio orçamento (aba Embalagens) — não há
  // mais um valor fixo aqui, para não somar em dobro com os itens escolhidos.

  // Descontos comerciais
  descPromocional: 0.10,
  descAtacado: 0.15,

  // Segurança comercial — ativado por padrão: não deixa salvar promo/atacado abaixo do preço mínimo
  impedirPrecoAbaixoMinimo: true
};

let state = { config: { ...DEFAULT_CONFIG }, materiais: [], impressoras: [], embalagens: [], adicionais: [], pedidos: [] };
let github = { owner:'', repo:'', path:'data.json', branch:'main', token:'' };
let ghSha = null;
let syncState = 'off'; // off | busy | ok | err
let syncMsg = '';
let tab = 'novo';
let editingPedidoId = null;
let draft = null;
let saveTimer = null;
let dirty = false; // true entre uma edição e o push confirmado — nunca fazemos refetch automático nesse meio-tempo
let formErrors = [];

// ---------- migrations (keep old saved data working with the new model) ----------
function migrateConfig(raw){
  const c = { ...DEFAULT_CONFIG, ...(raw||{}) };
  if (raw && raw.custosIndiretosHora === undefined && raw.adminHora !== undefined) c.custosIndiretosHora = raw.adminHora;
  if (raw && raw.tarifaProjetoHora === undefined) c.tarifaProjetoHora = c.maoObraHora;
  return c;
}
function migratePedido(p){
  return {
    id: p.id, numero: p.numero, data: p.data, cliente: p.cliente||'', produto: p.produto||'',
    quantidade: p.quantidade||0, materialId: p.materialId||'', peso: p.peso||0, pesoModo: p.pesoModo ?? 'peca',
    impressoraId: p.impressoraId||'', tempoImpressao: p.tempoImpressao||0,
    // tempos por LOTE (não multiplicam pela quantidade)
    tempoPreparacaoLote: p.tempoPreparacaoLote ?? p.tempoPreparacao ?? 0,
    tempoConfiguracaoLote: p.tempoConfiguracaoLote ?? 0,
    tempoPreparacaoMaquinaLote: p.tempoPreparacaoMaquinaLote ?? 0,
    outrosTemposLote: p.outrosTemposLote ?? 0,
    // tempos por PEÇA (multiplicam pela quantidade)
    tempoAcabamentoPeca: p.tempoAcabamentoPeca ?? p.tempoAcabamento ?? 0,
    tempoMontagemPeca: p.tempoMontagemPeca ?? p.tempoMontagem ?? 0,
    tempoEmbalagemPeca: p.tempoEmbalagemPeca ?? p.tempoEmbalagem ?? 0,
    outrosTemposPeca: p.outrosTemposPeca ?? p.outrosTempos ?? 0,
    // acabamento (materiais)
    acabamentoExtraValor: p.acabamentoExtraValor ?? p.acabamentoExtra ?? 0,
    acabamentoExtraModo: p.acabamentoExtraModo ?? 'peca',
    // embalagens e adicionais escolhidos neste orçamento (itens do catálogo + quantidade)
    embalagensItens: Array.isArray(p.embalagensItens) ? p.embalagensItens : [],
    adicionaisItens: Array.isArray(p.adicionaisItens) ? p.adicionaisItens : [],
    // produção em fornadas — pedidos antigos vêm com producaoPorFornada:false, preservando
    // exatamente o comportamento anterior (tempoImpressao interpretado como tempo por PEÇA)
    producaoPorFornada: p.producaoPorFornada ?? false,
    pecasPorFornada: p.pecasPorFornada ?? 1,
    tempoPreparacaoFornada: p.tempoPreparacaoFornada ?? 0,
    tempoRetiradaFornada: p.tempoRetiradaFornada ?? 0,
    outrosTemposFornada: p.outrosTemposFornada ?? 0,
    // AMS Lite / impressão multicolorida
    usarAmsLite: p.usarAmsLite ?? false,
    quantidadeCores: p.quantidadeCores ?? 1,
    modoTempoAms: p.modoTempoAms ?? 'total',
    tempoAdicionalAmsFornada: p.tempoAdicionalAmsFornada ?? 0,
    estimarAmsPorTrocas: p.estimarAmsPorTrocas ?? false,
    numTrocasFornada: p.numTrocasFornada ?? 0,
    segundosPorTroca: p.segundosPorTroca ?? 0,
    // serviços adicionais (opcional)
    modelagem3dHoras: p.modelagem3dHoras ?? 0,
    alteracaoModeloHoras: p.alteracaoModeloHoras ?? 0,
    projetoPersonalizadoHoras: p.projetoPersonalizadoHoras ?? 0,
    prototipagemHoras: p.prototipagemHoras ?? 0,
    outrosServicosHoras: p.outrosServicosHoras ?? 0,
    materiaisServicosExtras: p.materiaisServicosExtras ?? 0,
    status: p.status || 'Orçamento'
  };
}

// ---------- github settings (local only, never synced) ----------
function loadSettings(){
  try{ const raw = localStorage.getItem(LS_SETTINGS_KEY); if (raw) github = { ...github, ...JSON.parse(raw) }; } catch(e){}
}
function saveSettings(){ localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(github)); }
function githubConfigured(){ return !!(github.owner && github.repo && github.token); }

// ---------- base64 (unicode-safe) ----------
function b64Encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64Decode(b64){
  const bin = atob(b64.replace(/\n/g,''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

// ---------- github sync ----------
async function ghFetch(){
  if (!githubConfigured()) return;
  setSync('busy','Buscando dados do GitHub…');
  try{
    const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}?ref=${github.branch}`;
    const res = await fetch(url, { headers: { Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json' } });
    if (res.status === 404){ ghSha = null; setSync('ok','Repositório vazio — será criado no próximo salvamento.'); return; }
    if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
    const json = await res.json();
    ghSha = json.sha;
    const content = b64Decode(json.content);
    const remote = JSON.parse(content);
    state = {
      config: migrateConfig(remote.config),
      materiais: remote.materiais||[],
      impressoras: remote.impressoras||[],
      embalagens: remote.embalagens||[],
      adicionais: remote.adicionais||[],
      pedidos: (remote.pedidos||[]).map(migratePedido)
    };
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(state));
    setSync('ok', 'Sincronizado com o GitHub.');
  } catch(e){
    setSync('err', 'Falha ao buscar do GitHub: ' + e.message);
  }
}
// Busca APENAS o SHA mais recente do arquivo remoto, sem tocar em `state`.
// Usada na resolução de conflitos para nunca sobrescrever silenciosamente o estado local.
async function ghGetLatestSha(){
  const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}?ref=${github.branch}`;
  const res = await fetch(url, { headers: { Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
  const json = await res.json();
  return json.sha;
}
async function ghPush(retry){
  if (!githubConfigured()) { localStorage.setItem(LS_DATA_KEY, JSON.stringify(state)); return true; }
  setSync('busy','Salvando no GitHub…');
  try{
    const url = `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${encodeURIComponent(github.path)}`;
    const body = { message:`Atualiza dados — ${new Date().toLocaleString('pt-BR')}`, content: b64Encode(JSON.stringify(state,null,2)), branch: github.branch };
    if (ghSha) body.sha = ghSha;
    const res = await fetch(url, { method:'PUT', headers:{ Authorization:`Bearer ${github.token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    if (res.status === 409){
      if (retry){
        // Já tentamos uma vez preservando o estado local e mesmo assim houve outro conflito.
        // Não sobrescrevemos nada silenciosamente — avisamos e paramos.
        setSync('err', 'Conflito de sincronização no GitHub — suas alterações NÃO foram perdidas e continuam só neste navegador. Abra a aba Sincronização e tente salvar novamente.');
        return false;
      }
      // Preserva `state` local integralmente. Busca só o SHA mais recente para poder tentar de novo.
      try{
        ghSha = await ghGetLatestSha();
      } catch(shaErr){
        setSync('err', 'Conflito de sincronização no GitHub e falha ao obter a versão mais recente: ' + shaErr.message);
        return false;
      }
      return ghPush(true);
    }
    if (!res.ok) throw new Error(`GitHub respondeu ${res.status}`);
    const json = await res.json();
    ghSha = json.content.sha;
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(state));
    setSync('ok', 'Salvo no GitHub às ' + new Date().toLocaleTimeString('pt-BR'));
    return true;
  } catch(e){
    setSync('err', 'Falha ao salvar no GitHub: ' + e.message);
    return false;
  }
}
function setSync(s,msg){ syncState=s; syncMsg=msg; renderSyncStatus(); }
function renderSyncStatus(){
  const el = document.getElementById('sync-status');
  if (!el) return;
  if (!githubConfigured()){
    el.innerHTML = `<span class="sync-dot off"></span>Dados salvos só neste navegador`;
    return;
  }
  el.innerHTML = `<span class="sync-dot ${syncState}"></span>${syncMsg}`;
}
function queueSync(){

// ==================================================================
// MOTOR DE CÁLCULO
// DADOS → CUSTOS DIRETOS → RISCO → CUSTOS INDIRETOS → CUSTO TOTAL
// → PREÇO MÍNIMO → PREÇO RECOMENDADO → DESCONTOS → MARGENS RESULTANTES
// ==================================================================
function precoGrama(m){ return m.pesoRolo > 0 ? m.precoRolo / m.pesoRolo : 0; }
function custoHoraImpressora(imp){
  const dep = imp.vidaUtil > 0 ? imp.valorAquisicao / imp.vidaUtil : 0;
  const man = imp.horasMes > 0 ? imp.manutencaoMensal / imp.horasMes : 0;
  return { dep, man, total: dep + man };
}

// Pura: preço a partir de um custo total já fechado + configuração de percentuais.
function computePricing(custoTotal, cfg){
  const somaPerc = (cfg.percImpostos||0)+(cfg.percComissao||0)+(cfg.percMargem||0);
  const percentuaisValidos = somaPerc < 1;
  const denomMin = 1 - (cfg.percImpostos||0) - (cfg.percComissao||0);
  const denomRec = denomMin - (cfg.percMargem||0);
  const precoMinimo = denomMin > 0 ? custoTotal / denomMin : 0;
  const precoRecomendado = (percentuaisValidos && denomRec > 0) ? custoTotal / denomRec : 0;

  function breakdown(preco){
    const impostoV = preco * (cfg.percImpostos||0);
    const comissaoV = preco * (cfg.percComissao||0);
    const lucro = preco - custoTotal - impostoV - comissaoV;
    const margemReal = preco > 0 ? lucro / preco : 0;
    const markup = custoTotal > 0 ? (preco / custoTotal - 1) : 0;
    const abaixoMinimo = preco < precoMinimo - 1e-9;
    return { preco, impostoV, comissaoV, lucro, margemReal, markup, abaixoMinimo };
  }

  const recomendado = breakdown(precoRecomendado);
  const precoPromocional = precoRecomendado * (1 - (cfg.descPromocional||0));
  const promocional = breakdown(precoPromocional);
  const precoAtacado = precoRecomendado * (1 - (cfg.descAtacado||0));
  const atacado = breakdown(precoAtacado);

  return { precoMinimo, recomendado, promocional, atacado, percentuaisValidos };
}

// Pura: calcula quantas fornadas são necessárias e o tamanho da última fornada.
// Quando produção em fornadas está desativada (ou quantidade <= 1), cada peça é sua própria "fornada",
// preservando exatamente o comportamento antigo (tempoImpressao × quantidade).
function calcularFornadas(p){
  const quantidade = Math.max(0, Number(p.quantidade) || 0);

  if (quantidade <= 1 || !p.producaoPorFornada) {
    return {
      quantidade,
      pecasPorFornada: 1,
      fornadas: quantidade,
      ultimaFornada: quantidade
    };
  }

  const capacidade = Math.max(1, Math.floor(Number(p.pecasPorFornada) || 1));
  const fornadas = Math.ceil(quantidade / capacidade);
  const restante = quantidade % capacidade;

  return {
    quantidade,
    pecasPorFornada: capacidade,
    fornadas,
    ultimaFornada: restante === 0 ? capacidade : restante
  };
}
// Regra da AMS Lite: nunca somar duas fontes de tempo AMS ao mesmo tempo.
// - modo 'total': o usuário já informou o tempo real da fornada COM a AMS incluída — não soma nada de novo.
// - modo 'base': o usuário informou o tempo SEM a AMS + um adicional (direto ou estimado por trocas de filamento).
function calcularTempoAmsFornada(p){
  if (!p.usarAmsLite || p.modoTempoAms !== 'base') return 0;
  if (p.estimarAmsPorTrocas){
    const trocas = Math.max(0, Number(p.numTrocasFornada) || 0);
    const segundos = Math.max(0, Number(p.segundosPorTroca) || 0);
    return (trocas * segundos) / 3600;
  }
  return Math.max(0, p.tempoAdicionalAmsFornada || 0);
}
function amsCoresValidas(n){ return n >= 1 && n <= 4; }

function calcPedidoCore(p, cfg, mat, imp, embalagensCat, adicionaisCat){
  embalagensCat = embalagensCat || [];
  adicionaisCat = adicionaisCat || [];
  const qtd = Math.max(0, p.quantidade||0);

  // ---- produção em fornadas: calculada primeiro, pois peso e tempo de impressão dependem dela ----
  const producao = calcularFornadas(p);

  // ---- peso: por PEÇA ou da FORNADA INTEIRA — escolhido explicitamente por `pesoModo`, independente ----
  // do checkbox de produção em fornadas. O Bambu Studio mostra o peso total da chapa quando várias
  // peças são impressas juntas, então às vezes você só tem esse número mesmo sem usar o modo fornada
  // aqui. O material total nunca muda por causa da estratégia de impressão: mesmas peças, mesmo peso
  // total. Quando fornadas está desligado, `producao.fornadas` já vale a própria quantidade, então
  // "fornada" e "peça" dão o mesmo resultado nesse caso — sem risco de inconsistência.
  const pesoTotal = (p.pesoModo === 'fornada')
    ? Math.max(0, p.peso||0) * producao.fornadas
    : Math.max(0, p.peso||0) * qtd;

  // ---- tempo de impressão: por PEÇA (fornadas desligadas) ou por FORNADA (fornadas ligadas) ----
  // Campo `tempoImpressao` é reinterpretado conforme `producaoPorFornada`, sem renomear/quebrar dados antigos:
  //   producaoPorFornada = false (padrão dos pedidos antigos) -> tempoImpressao = tempo de UMA peça
  //   producaoPorFornada = true  -> tempoImpressao = tempo de UMA fornada (várias peças juntas na mesa)
  const tempoAmsFornada = calcularTempoAmsFornada(p);
  const tempoPorFornadaEfetivo = Math.max(0, p.tempoImpressao||0) + tempoAmsFornada;
  const tempoImpressaoTotal = (p.producaoPorFornada && qtd > 1)
    ? tempoPorFornadaEfetivo * producao.fornadas
    : tempoPorFornadaEfetivo * qtd;

  const horasLote = Math.max(0,p.tempoPreparacaoLote||0) + Math.max(0,p.tempoConfiguracaoLote||0)
    + Math.max(0,p.tempoPreparacaoMaquinaLote||0) + Math.max(0,p.outrosTemposLote||0);
  // Tempos por FORNADA: repetem a cada fornada (não a cada peça, não uma única vez para o pedido inteiro)
  const horasFornadaUnit = Math.max(0,p.tempoPreparacaoFornada||0) + Math.max(0,p.tempoRetiradaFornada||0)
    + Math.max(0,p.outrosTemposFornada||0);
  const horasFornadaTotal = horasFornadaUnit * producao.fornadas;
  const horasPecaUnit = Math.max(0,p.tempoAcabamentoPeca||0) + Math.max(0,p.tempoMontagemPeca||0)
    + Math.max(0,p.tempoEmbalagemPeca||0) + Math.max(0,p.outrosTemposPeca||0);
  const horasPecaTotal = horasPecaUnit * qtd;

  // ---- custos diretos ----
  const pg = mat ? precoGrama(mat) : 0;
  const custoMaterial = pesoTotal * pg;
  const perdaMaterial = custoMaterial * (cfg.percPerdas||0);
  const custoMaterialFinal = custoMaterial + perdaMaterial;

  const potencia = imp ? imp.potencia : cfg.potenciaPadraoW;
  const custoEnergia = (potencia/1000) * tempoImpressaoTotal * (cfg.precoKWh||0);

  const depHora = imp ? custoHoraImpressora(imp).dep : ((cfg.valorImpressoraPadrao||0)/(cfg.vidaUtilPadrao||1));
  const manHora = imp ? custoHoraImpressora(imp).man : ((cfg.manutencaoMensalPadrao||0)/(cfg.horasMesPadrao||1));
  const custoDepreciacao = tempoImpressaoTotal * depHora;
  const custoManutencao = tempoImpressaoTotal * manHora;
  const custoMaquina = custoDepreciacao + custoManutencao;

  const maoObraLote = horasLote * (cfg.maoObraHora||0);
  const maoObraFornada = horasFornadaTotal * (cfg.maoObraHora||0);
  const maoObraPeca = horasPecaTotal * (cfg.maoObraHora||0);
  const maoObraTotal = maoObraLote + maoObraFornada + maoObraPeca;

  // ---- risco de falha/reimpressão (sobre custos produtivos, nunca sobre impostos/comissão/margem, nunca por fornada) ----
  const custoProdutivoAntesRisco = custoMaterialFinal + custoEnergia + custoMaquina + maoObraTotal;
  const custoRisco = custoProdutivoAntesRisco * (cfg.percFalha||0);
  const custoProdutivoAposRisco = custoProdutivoAntesRisco + custoRisco;

  // ---- acabamento (materiais), embalagem, serviços de projeto ----
  const acabamentoMaterial = (p.acabamentoExtraModo === 'lote')
    ? (p.acabamentoExtraValor||0)
    : (p.acabamentoExtraValor||0) * qtd;
  // Embalagens escolhidas do catálogo (itens específicos, cada um com sua própria quantidade neste pedido).
  const custoEmbalagensItens = (p.embalagensItens||[]).reduce((soma, it) => {
    const e = embalagensCat.find(x => x.id === it.embalagemId);
    return soma + (e ? e.valor * Math.max(0, it.quantidade||0) : 0);
  }, 0);

  // Adicionais escolhidos do catálogo. "unidade" multiplica pela quantidade do item; "fixo" cobra
  // uma vez só, independente da quantidade informada naquele item.
  const custoAdicionaisItens = (p.adicionaisItens||[]).reduce((soma, it) => {
    const a = adicionaisCat.find(x => x.id === it.adicionalId);
    if (!a) return soma;
    const qtdItem = Math.max(0, it.quantidade||0);
    const valorItem = a.tipoCobranca === 'fixo' ? a.valor : a.valor * qtdItem;
    return soma + valorItem;
  }, 0);

  const horasServicos = Math.max(0,p.modelagem3dHoras||0) + Math.max(0,p.alteracaoModeloHoras||0)
    + Math.max(0,p.projetoPersonalizadoHoras||0) + Math.max(0,p.prototipagemHoras||0) + Math.max(0,p.outrosServicosHoras||0);
  const tarifaServico = cfg.tarifaProjetoHora || cfg.maoObraHora || 0;
  const custoServicos = horasServicos * tarifaServico + (p.materiaisServicosExtras||0);

  // ---- custos indiretos rateados (sobre horas efetivamente trabalhadas, sem duplicar máquina/mão de obra/embalagem) ----
  const horasProdutivas = tempoImpressaoTotal + horasLote + horasFornadaTotal + horasPecaTotal;
  const custosIndiretos = horasProdutivas * (cfg.custosIndiretosHora||0);

  // ---- custo total real ----
  const custoTotal = custoProdutivoAposRisco + acabamentoMaterial + custoEmbalagensItens
    + custosIndiretos + custoServicos + custoAdicionaisItens;

  const pricing = computePricing(custoTotal, cfg);
  const precoUnitario = qtd > 0 ? pricing.recomendado.preco / qtd : 0;

  return {
    qtd, pesoTotal, tempoImpressaoTotal, horasLote, horasFornadaTotal, horasPecaTotal, producao,
    custoMaterial, perdaMaterial, custoMaterialFinal,
    custoEnergia, custoDepreciacao, custoManutencao, custoMaquina,
    maoObraLote, maoObraFornada, maoObraPeca, maoObraTotal,
    custoProdutivoAntesRisco, custoRisco, custoProdutivoAposRisco,
    acabamentoMaterial, custoEmbalagensItens, custoAdicionaisItens, custoServicos, custosIndiretos,
    custoTotal, precoUnitario,
    ...pricing
  };
}
function calcPedido(p){
  const cfg = state.config;
  const mat = state.materiais.find(m => m.id === p.materialId);
  const imp = state.impressoras.find(i => i.id === p.impressoraId);
  return calcPedidoCore(p, cfg, mat, imp, state.embalagens, state.adicionais);
}

// Comparativo informativo (NÃO é desconto comercial): custo por peça produzindo uma de cada vez
// vs. custo por peça usando a fornada configurada. Só os custos que realmente variam com o número
// de fornadas mudam (tempo de máquina, energia, depreciação, manutenção, trabalhos por fornada);
// custos por peça e custos gerais do pedido permanecem os mesmos nos dois cenários.
function calcEconomiaFornada(p, cfg, mat, imp, embalagensCat, adicionaisCat){
  if (!p.producaoPorFornada || !(p.quantidade > 1) || !(p.tempoImpressao > 0)) return null;
  const comFornada = calcPedidoCore(p, cfg, mat, imp, embalagensCat, adicionaisCat);
  if (!(comFornada.qtd > 0)) return null;
  if (comFornada.producao.fornadas >= comFornada.qtd) return null; // sem lote real, nada a comparar
  // O peso informado é o peso da FORNADA inteira (não de uma peça). Para comparar com o cenário
  // "sem fornada" sem inventar material que não existe, convertemos para peso-por-peça equivalente
  // a partir do peso total já calculado corretamente acima — assim o material bate igual nos dois
  // cenários (o total de matéria-prima não muda por causa da estratégia de impressão).
  const pesoPorPecaEquivalente = comFornada.pesoTotal / comFornada.qtd;
  const semFornada = calcPedidoCore({ ...p, producaoPorFornada:false, pesoModo:'peca', peso: pesoPorPecaEquivalente }, cfg, mat, imp, embalagensCat, adicionaisCat);
  if (!(semFornada.qtd > 0)) return null;
  const custoUnitCom = comFornada.custoTotal / comFornada.qtd;
  const custoUnitSem = semFornada.custoTotal / semFornada.qtd;
  return { custoUnitSem, custoUnitCom, economia: custoUnitSem - custoUnitCom };
}

function validatePedidoForSave(p, cfg){
  const errs = [];
  if (!(p.quantidade > 0)) errs.push('Informe uma quantidade maior que zero.');
  if (!(p.peso > 0)) errs.push(p.pesoModo === 'fornada' ? 'Informe o peso da fornada (peso de todas as peças da mesa).' : 'Informe um peso por peça maior que zero.');
  if (p.producaoPorFornada){
    if (!(p.tempoImpressao > 0)) errs.push('Informe o tempo de impressão da fornada.');
    if (!(p.pecasPorFornada >= 1)) errs.push('Peças por fornada deve ser pelo menos 1.');
  } else {
    if (!(p.tempoImpressao > 0)) errs.push('Informe um tempo de impressão por peça maior que zero.');
  }
  if (p.usarAmsLite){
    if (!amsCoresValidas(p.quantidadeCores)) errs.push('Quantidade de cores da AMS deve estar entre 1 e 4.');
    if ((p.tempoAdicionalAmsFornada||0) < 0) errs.push('Tempo adicional da AMS não pode ser negativo.');
    if ((p.numTrocasFornada||0) < 0) errs.push('Número de trocas de filamento não pode ser negativo.');
    if ((p.segundosPorTroca||0) < 0) errs.push('Tempo médio por troca não pode ser negativo.');
  }
  if (!p.materialId) errs.push('Selecione um material.');
  if (!p.impressoraId) errs.push('Selecione uma impressora.');
  const mat = state.materiais.find(m=>m.id===p.materialId);
  if (mat && (!(mat.pesoRolo>0) || !(mat.precoRolo>0))) errs.push('O material selecionado tem peso ou preço do rolo zerado/inválido — corrija em Materiais.');
  const imp = state.impressoras.find(i=>i.id===p.impressoraId);
  if (imp && (!(imp.vidaUtil>0) || !(imp.horasMes>0))) errs.push('A impressora selecionada tem vida útil ou horas produtivas/mês zeradas — corrija em Impressoras.');
  const soma = (cfg.percImpostos||0)+(cfg.percComissao||0)+(cfg.percMargem||0);
  if (soma >= 1) errs.push('Impostos + comissão + margem somam 100% ou mais — ajuste em Configurações antes de salvar.');
  if (cfg.impedirPrecoAbaixoMinimo && mat && imp){
    const r = calcPedidoCore(p, cfg, mat, imp, state.embalagens, state.adicionais);
    if (r.promocional.abaixoMinimo) errs.push('O preço promocional configurado ficaria abaixo do preço mínimo — ajuste o desconto ou desative essa trava em Configurações.');
    if (r.atacado.abaixoMinimo) errs.push('O preço de atacado configurado ficaria abaixo do preço mínimo — ajuste o desconto ou desative essa trava em Configurações.');
  }
  return errs;
}
function pedidoWarnings(p){
  const warns = [];
  if (p.quantidade > 0){
    if (!(p.peso > 0)) warns.push(p.pesoModo === 'fornada' ? 'Peso da fornada está zerado — o custo de material não está sendo considerado.' : 'Peso por peça está zerado — o custo de material não está sendo considerado.');
    if (p.producaoPorFornada){
      if (!(p.tempoImpressao > 0)) warns.push('Tempo de impressão por fornada está zerado — energia e custo de máquina não estão sendo considerados.');
    } else {
      if (!(p.tempoImpressao > 0)) warns.push('Tempo de impressão por peça está zerado — energia e custo de máquina não estão sendo considerados.');
    }
  }
  if (p.usarAmsLite && (p.quantidadeCores||1) > 1){
    warns.push('Impressão multicolorida pode aumentar o tempo devido às trocas de filamento. Use o tempo real do Bambu Studio para maior precisão.');
  }
  const mat = state.materiais.find(m=>m.id===p.materialId);
  if (mat && (!(mat.pesoRolo>0) || !(mat.precoRolo>0))) warns.push('O material selecionado tem peso ou preço do rolo inválido — corrija em Materiais.');
  const imp = state.impressoras.find(i=>i.id===p.impressoraId);
  if (imp && (!(imp.vidaUtil>0) || !(imp.horasMes>0))) warns.push('A impressora selecionada tem vida útil ou horas produtivas/mês inválidas — corrija em Impressoras.');
  return warns;
}

function pedidoTeste(overrides){
  return {
    quantidade:1, materialId:'', peso:0, pesoModo:'peca', impressoraId:'', tempoImpressao:0,
    tempoPreparacaoLote:0, tempoConfiguracaoLote:0, tempoPreparacaoMaquinaLote:0, outrosTemposLote:0,

    acabamentoExtraValor:0, acabamentoExtraModo:'peca',
    embalagensItens:[], adicionaisItens:[],
    producaoPorFornada:false, pecasPorFornada:1,
    tempoPreparacaoFornada:0, tempoRetiradaFornada:0, outrosTemposFornada:0,
    usarAmsLite:false, quantidadeCores:1, modoTempoAms:'total', tempoAdicionalAmsFornada:0,
    estimarAmsPorTrocas:false, numTrocasFornada:0, segundosPorTroca:0,
    modelagem3dHoras:0, alteracaoModeloHoras:0, projetoPersonalizadoHoras:0, prototipagemHoras:0, outrosServicosHoras:0, materiaisServicosExtras:0,
    ...overrides
  };
}
function runSelfTests(){
  const out = [];
  const push = (name, pass, detail) => out.push({ name, pass, detail });

  // Teste 1 — preço recomendado
  {
    const cfg = { ...DEFAULT_CONFIG, percImpostos:0.06, percComissao:0, percMargem:0.30 };
    const r = computePricing(100, cfg);
    push('Teste 1 — Preço recomendado (custo 100, imposto 6%, margem 30%)',
      Math.abs(r.recomendado.preco - 156.25) < 0.01,
      `esperado R$156,25 — obtido R$${r.recomendado.preco.toFixed(2)}`);

    // Teste 2 — margem real
    push('Teste 2 — Margem líquida real do preço recomendado = 30%',
      Math.abs(r.recomendado.margemReal - 0.30) < 0.001,
      `obtido ${(r.recomendado.margemReal*100).toFixed(2)}%`);

    // Teste 3 — desconto promocional reduz margem
    push('Teste 3 — Desconto promocional reduz a margem líquida',
      r.promocional.margemReal < r.recomendado.margemReal,
      `recomendada ${(r.recomendado.margemReal*100).toFixed(1)}% vs promocional ${(r.promocional.margemReal*100).toFixed(1)}%`);
  }

  // Teste 4 — alerta de preço abaixo do mínimo
  {
    const cfg = { ...DEFAULT_CONFIG, percImpostos:0.06, percComissao:0, percMargem:0.30, descPromocional:0.90 };
    const r = computePricing(100, cfg);
    push('Teste 4 — Preço abaixo do mínimo gera alerta',
      r.promocional.abaixoMinimo === true,
      `preço promocional R$${r.promocional.preco.toFixed(2)} vs mínimo R$${r.precoMinimo.toFixed(2)}`);
  }

  // Teste 5 — 20 min de preparação de LOTE não multiplicam por 10 peças
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:10, tempoPreparacaoLote: 20/60 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 5 — Preparação de lote (20 min) não escala com 10 peças',
      Math.abs(r.horasLote*60 - 20) < 0.01,
      `horasLote = ${(r.horasLote*60).toFixed(1)} min (esperado 20 min, NUNCA 200)`);
  }

  // Teste 6 — 10 min de acabamento por PEÇA × 10 peças = 100 min
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:10, tempoAcabamentoPeca: 10/60 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 6 — Acabamento por peça (10 min) × 10 peças',
      Math.abs(r.horasPecaTotal*60 - 100) < 0.01,
      `horasPecaTotal = ${(r.horasPecaTotal*60).toFixed(1)} min (esperado 100 min)`);
  }

  // Teste 7 — taxa de falha/reimpressão
  {
    const cfg = { ...DEFAULT_CONFIG, percFalha:0.05, percPerdas:0, maoObraHora:0, custosIndiretosHora:0 };
    const mat = { pesoRolo:1000, precoRolo:100 }; // preço/g = 0.10
    // 1000g * 0.10 = R$100 de material, sem perdas/energia/máquina/mão de obra
    const p = pedidoTeste({ quantidade:1, peso:1000, materialId:'m' });
    const r = calcPedidoCore(p, cfg, mat, null);
    push('Teste 7 — Risco de falha de 5% sobre custo produtivo de R$100',
      Math.abs(r.custoRisco - 5) < 0.01 && Math.abs(r.custoProdutivoAposRisco - 105) < 0.01,
      `custo de risco = R$${r.custoRisco.toFixed(2)} (esperado R$5,00); produtivo após risco = R$${r.custoProdutivoAposRisco.toFixed(2)} (esperado R$105,00)`);
  }

  // Teste 8 — 1 peça (deve funcionar como sempre funcionou)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:1, producaoPorFornada:false, tempoImpressao:5 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 8 — 1 peça, tempo de impressão 5h',
      Math.abs(r.tempoImpressaoTotal - 5) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 5h)`);
  }

  // Teste 9 — 10 peças SEM fornadas: comprova que a lógica antiga continua intacta
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:10, producaoPorFornada:false, tempoImpressao:5 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 9 — 10 peças sem fornadas (5h cada)',
      Math.abs(r.tempoImpressaoTotal - 50) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 50h — lógica antiga preservada)`);
  }

  // Teste 10 — 10 peças / 5 por fornada = 2 fornadas de 5h = 10h de máquina (não 50h)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:10, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:5 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 10 — 10 peças / 5 por fornada / 5h por fornada',
      r.producao.fornadas === 2 && Math.abs(r.tempoImpressaoTotal - 10) < 0.001,
      `fornadas = ${r.producao.fornadas} (esperado 2), tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 10h, NUNCA 50h)`);
  }

  // Teste 11 — 23 peças / 5 por fornada: 5 fornadas, última com 3 peças
  {
    const r = calcularFornadas({ quantidade:23, producaoPorFornada:true, pecasPorFornada:5 });
    push('Teste 11 — 23 peças / 5 por fornada',
      r.fornadas === 5 && r.ultimaFornada === 3,
      `fornadas = ${r.fornadas} (esperado 5), última fornada = ${r.ultimaFornada} peças (esperado 3)`);
  }

  // Teste 12 — peso por PEÇA (sem fornadas) continua multiplicando pela quantidade normalmente
  {
    const cfg = { ...DEFAULT_CONFIG, percPerdas:0 };
    const mat = { pesoRolo:1000, precoRolo:0 };
    const p = pedidoTeste({ quantidade:20, peso:100, producaoPorFornada:false, tempoImpressao:1 });
    const r = calcPedidoCore(p, cfg, mat, null);
    push('Teste 12 — Peso por peça (100g) × 20 peças sem fornadas',
      Math.abs(r.pesoTotal - 2000) < 0.001,
      `pesoTotal = ${r.pesoTotal.toFixed(0)}g (esperado 2000g)`);
  }

  // Teste 13 — acabamento continua por PEÇA mesmo com fornadas ativas
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:20, tempoAcabamentoPeca:10/60, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:1 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 13 — Acabamento por peça (10 min) × 20 peças, com fornadas ativas',
      Math.abs(r.horasPecaTotal*60 - 200) < 0.01,
      `horasPecaTotal = ${(r.horasPecaTotal*60).toFixed(1)} min (esperado 200 min)`);
  }

  // Teste 14 — preparação POR FORNADA (10 min) × 4 fornadas = 40 min
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:20, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:1, tempoPreparacaoFornada:10/60 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 14 — Preparação por fornada (10 min) × 4 fornadas',
      r.producao.fornadas === 4 && Math.abs(r.horasFornadaTotal*60 - 40) < 0.01,
      `fornadas = ${r.producao.fornadas} (esperado 4), horasFornadaTotal = ${(r.horasFornadaTotal*60).toFixed(1)} min (esperado 40 min)`);
  }

  // Teste 15 — energia/máquina usam o TEMPO TOTAL REAL da máquina: 4 fornadas × 6h = 24h (não 120h)
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:20, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:6 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 15 — 20 peças / 5 por fornada / 6h por fornada = 24h de máquina',
      Math.abs(r.tempoImpressaoTotal - 24) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 24h, NUNCA 120h)`);
  }

  // Teste 16 — AMS por tempo adicional: base 5h + AMS 1h = 6h (modo 'base')
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:1, tempoImpressao:5, usarAmsLite:true, modoTempoAms:'base', tempoAdicionalAmsFornada:1 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 16 — AMS modo base: 5h + 1h adicional = 6h',
      Math.abs(r.tempoImpressaoTotal - 6) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 6h)`);
  }

  // Teste 17 — AMS não duplica: modo 'total' já é o tempo completo, não soma tempoAdicionalAmsFornada de novo
  {
    const cfg = { ...DEFAULT_CONFIG };
    const p = pedidoTeste({ quantidade:1, tempoImpressao:6, usarAmsLite:true, modoTempoAms:'total', tempoAdicionalAmsFornada:1 });
    const r = calcPedidoCore(p, cfg, null, null);
    push('Teste 17 — AMS modo total (6h) não soma adicional de novo',
      Math.abs(r.tempoImpressaoTotal - 6) < 0.001,
      `tempoImpressaoTotal = ${r.tempoImpressaoTotal.toFixed(2)}h (esperado 6h, NUNCA 7h)`);
  }

  // Teste 18 — validação de quantidade de cores da AMS (1 a 4)
  {
    push('Teste 18 — Quantidade de cores da AMS (1–4 válido, 5 inválido)',
      amsCoresValidas(4) === true && amsCoresValidas(5) === false && amsCoresValidas(1) === true && amsCoresValidas(0) === false,
      `cores=4 → ${amsCoresValidas(4)} (esperado true); cores=5 → ${amsCoresValidas(5)} (esperado false)`);
  }

  // Teste 19 — peso da FORNADA (peso da chapa inteira, como o Bambu Studio mostra) não multiplica por peça
  {
    const cfg = { ...DEFAULT_CONFIG };
    const mat = { pesoRolo:1000, precoRolo:100 }; // preço/g = 0.10
    // 20 peças, 5 por fornada (4 fornadas), peso da chapa (5 peças juntas) = 100g -> total real = 400g
    const p = pedidoTeste({ quantidade:20, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:1, peso:100, pesoModo:'fornada' });
    const r = calcPedidoCore(p, cfg, mat, null);
    push('Teste 19 — Peso da fornada (100g de 5 peças) × 4 fornadas = 400g, não 100g×20=2000g',
      Math.abs(r.pesoTotal - 400) < 0.01,
      `pesoTotal = ${r.pesoTotal.toFixed(0)}g (esperado 400g, NUNCA 2000g)`);
  }

  // Teste 20 — "Esse peso é de" funciona de forma independente do checkbox de fornadas
  {
    const cfg = { ...DEFAULT_CONFIG };
    const mat = { pesoRolo:1000, precoRolo:100 };
    // Fornadas LIGADAS mas peso escolhido como "uma peça": material não deve considerar o número de fornadas
    const p1 = pedidoTeste({ quantidade:20, producaoPorFornada:true, pecasPorFornada:5, tempoImpressao:1, peso:20, pesoModo:'peca' });
    const r1 = calcPedidoCore(p1, cfg, mat, null);
    push('Teste 20a — Fornadas ligadas + peso "de uma peça" = peso × quantidade (20×20g=400g)',
      Math.abs(r1.pesoTotal - 400) < 0.01,
      `pesoTotal = ${r1.pesoTotal.toFixed(0)}g (esperado 400g)`);
    // Fornadas DESLIGADAS mas peso escolhido como "a fornada inteira": sem fornada real, cada peça é sua
    // própria fornada, então o resultado é igual ao modo "peça" (sem inconsistência).
    const p2 = pedidoTeste({ quantidade:20, producaoPorFornada:false, tempoImpressao:1, peso:20, pesoModo:'fornada' });
    const r2 = calcPedidoCore(p2, cfg, mat, null);
    push('Teste 20b — Fornadas desligadas + peso "da fornada": cada peça é sua fornada, resultado igual (400g)',
      Math.abs(r2.pesoTotal - 400) < 0.01,
      `pesoTotal = ${r2.pesoTotal.toFixed(0)}g (esperado 400g)`);
  }

  return out;
}

// Campos de tempo do pedido são editados em dias/horas/minutos, mas continuam guardados
// e usados internamente como horas decimais — o motor de cálculo não muda em nada.
function decompDHM(decimalHoras){
  const totalMin = Math.round(Math.max(0, decimalHoras||0) * 60);
  const dias = Math.floor(totalMin / (24*60));
  const restoAposDias = totalMin % (24*60);
  const horas = Math.floor(restoAposDias / 60);
  const minutos = restoAposDias % 60;
  return { dias, horas, minutos };
}
function composeDHM(dias, horas, minutos){
  return (Math.max(0,dias||0)*24) + Math.max(0,horas||0) + (Math.max(0,minutos||0)/60);
}
function fieldDHM(key, label){
  const { dias, horas, minutos } = decompDHM(draft[key]);
  return `<div class="field">
    <label>${label}</label>
    <div class="dhm-group">
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="d" value="${dias}"><span>d</span></div>
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="h" value="${horas}"><span>h</span></div>
      <div class="dhm-item"><input type="number" min="0" step="1" data-dhm="${key}" data-dhm-u="m" value="${minutos}"><span>min</span></div>
    </div>
  </div>`;
}

    || draft.tempoPreparacaoFornada>0 || draft.tempoRetiradaFornada>0 || draft.outrosTemposFornada>0
    || draft.tempoAcabamentoPeca>0 || draft.tempoMontagemPeca>0 || draft.tempoEmbalagemPeca>0 || draft.outrosTemposPeca>0
    || draft.acabamentoExtraValor>0
    || draft.modelagem3dHoras>0 || draft.alteracaoModeloHoras>0 || draft.projetoPersonalizadoHoras>0 || draft.prototipagemHoras>0
    || draft.outrosServicosHoras>0 || draft.materiaisServicosExtras>0;

  return `<h1>${editingPedidoId?'Editar':'Novo'} orçamento</h1><p class="lead">Preencha os dados da peça — o custo e o preço são calculados na hora.</p>

            <div class="line"><span>Perdas de material</span><span>${fmtR(r.perdaMaterial)}</span></div>
            <div class="line"><span>Energia</span><span>${fmtR(r.custoEnergia)}</span></div>
            <div class="line"><span>Depreciação da máquina</span><span>${fmtR(r.custoDepreciacao)}</span></div>
            <div class="line"><span>Manutenção da máquina</span><span>${fmtR(r.custoManutencao)}</span></div>
            <div class="line"><span>Mão de obra (lote)</span><span>${fmtR(r.maoObraLote)}</span></div>
            ${producaoAtiva ? `<div class="line"><span>Mão de obra (fornada)</span><span>${fmtR(r.maoObraFornada)}</span></div>` : ''}
            <div class="line"><span>Mão de obra (peça)</span><span>${fmtR(r.maoObraPeca)}</span></div>
            <div class="line"><span>Reserva para falhas/reimpressões</span><span>${fmtR(r.custoRisco)}</span></div>
            <div class="line"><span>Acabamento (materiais)</span><span>${fmtR(r.acabamentoMaterial)}</span></div>
            <div class="line"><span>Embalagens</span><span>${fmtR(r.custoEmbalagensItens)}</span></div>
            <div class="line"><span>Adicionais</span><span>${fmtR(r.custoAdicionaisItens)}</span></div>
            <div class="line"><span>Custos indiretos rateados</span><span>${fmtR(r.custosIndiretos)}</span></div>
            <div class="line"><span>Serviços de projeto/modelagem</span><span>${fmtR(r.custoServicos)}</span></div>
            <div class="line" style="font-weight:700; border-bottom:1px solid var(--ink);"><span>CUSTO TOTAL</span><span>${fmtR(r.custoTotal)}</span></div>
            <div class="line"><span>Preço mínimo — sem margem</span><span>${fmtR(r.precoMinimo)}</span></div>
            <div class="line"><span>Lucro líquido</span><span>${fmtR(r.recomendado.lucro)}</span></div>
            <div class="line"><span>Margem líquida</span><span>${fmtP(r.recomendado.margemReal)}</span></div>
            <div class="line"><span>Markup</span><span>${fmtP(r.recomendado.markup)}</span></div>
          </div>
          <div class="breakdown" style="margin-top:10px;">
            <div class="line"><span>Preço promocional</span><span>${fmtR(r.promocional.preco)}</span></div>
            <div class="line"><span>Margem promocional</span><span>${fmtP(r.promocional.margemReal)}</span></div>
            ${alertaAbaixoMinimo(r.promocional)}
            <div class="line" style="margin-top:6px;"><span>Preço atacado</span><span>${fmtR(r.atacado.preco)}</span></div>
            <div class="line"><span>Margem atacado</span><span>${fmtP(r.atacado.margemReal)}</span></div>
            ${alertaAbaixoMinimo(r.atacado)}
            <div class="line" style="margin-top:6px; font-weight:700;"><span>Preço unitário</span><span>${fmtR(r.precoUnitario)}</span></div>
          </div>
          ${economia ? `
          <div class="breakdown" style="margin-top:10px;">
            <div class="line" style="font-weight:700;"><span>ECONOMIA DE PRODUÇÃO EM FORNADAS</span><span></span></div>
            <div class="line"><span>Produção unitária (1 por fornada)</span><span>${fmtR(economia.custoUnitSem)}/peça</span></div>
            <div class="line"><span>Produção em ${draft.pecasPorFornada} por fornada</span><span>${fmtR(economia.custoUnitCom)}/peça</span></div>
            <div class="line" style="color:var(--ok); font-weight:700;"><span>Economia estimada</span><span>${fmtR(economia.economia)}/peça</span></div>
          </div>` : ''}
          `}
        </div></div></div>`;
}
function viewListaPedidos(){
  const rows = [...state.pedidos].sort((a,b)=>b.numero-a.numero).map(p=>{ const r = calcPedido(p);
    return `<tr><td class="mono">#${p.numero}</td><td>${p.data}</td><td>${p.cliente}</td><td>${p.produto}</td>
      <td class="num">${p.quantidade}</td><td class="num mono">${fmtR(r.custoTotal)}</td>
      <td class="num mono">${fmtR(r.recomendado.preco)}</td><td class="num mono" style="color:var(--ok)">${fmtR(r.recomendado.lucro)}</td>
      <td><span class="badge ${statusClass[p.status]||''}">${p.status}</span></td>
      <td class="row-actions"><button class="btn ghost small" data-edit-pedido="${p.id}">Editar</button>
        <button class="btn danger small" data-del-pedido="${p.id}">Excluir</button></td></tr>`; }).join('');
  return `<h1>Orçamentos</h1><p class="lead">Todos os pedidos salvos, com custo e preço já calculados.</p>
    <div class="card"><table><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Produto</th><th>Qtd</th><th>Custo</th><th>Preço</th><th>Lucro</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows || `<tr><td colspan="10"><div class="empty">Nenhum orçamento salvo ainda. Vá em "Novo orçamento".</div></td></tr>`}</tbody></table></div>`;
}
function viewTestes(){
  const results = runSelfTests();
  const allPass = results.every(r=>r.pass);
  const rows = results.map(r=>`<tr><td>${r.name}</td><td style="font-size:12px;color:var(--ink-soft)">${r.detail}</td>
    <td><span class="badge ${r.pass?'fin':'can'}">${r.pass?'PASSOU':'FALHOU'}</span></td></tr>`).join('');
  return `<h1>Testes automáticos</h1><p class="lead">Verificações internas da lógica de precificação — rodam sempre que você abre esta aba.</p>
    <div class="tag-note ${allPass?'info':'err'}">${allPass ? '✅ Todos os testes passaram.' : '⚠️ Um ou mais testes falharam — revise a lógica antes de confiar nos preços.'}</div>
    <div class="card"><table><thead><tr><th>Teste</th><th>Detalhe</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function viewGithub(){
  const g = github;
  return `<h1>Sincronização com o GitHub</h1>
    <p class="lead">Seus dados ficam salvos como um arquivo <code>${g.path||'data.json'}</code> dentro de um repositório <strong>privado</strong>, a cada alteração.</p>
    <div class="tag-note info">O token fica salvo só neste navegador (localStorage) — nunca é enviado para o repositório nem aparece no código da página.</div>
    <div class="tag-note">No plano gratuito do GitHub, Pages só publica repositórios <strong>públicos</strong>. Por isso o site (código) fica num repositório público e os dados ficam num repositório <strong>separado e privado</strong> — veja o passo a passo abaixo.</div>
    <div class="card"><h2>Repositório de dados (privado)</h2><div class="grid">
        <div class="field"><label>Usuário/organização do GitHub</label><input id="gh-owner" value="${g.owner}" placeholder="ex: gustavo-rocha"></div>
        <div class="field"><label>Nome do repositório privado de dados</label><input id="gh-repo" value="${g.repo}" placeholder="ex: 028labs-dados"></div>
        <div class="field"><label>Branch</label><input id="gh-branch" value="${g.branch}" placeholder="main"></div>
        <div class="field"><label>Caminho do arquivo</label><input id="gh-path" value="${g.path}" placeholder="data.json"></div>
      </div></div>
    <div class="card"><h2>Token de acesso pessoal</h2>
      <p class="card-note">Crie em github.com/settings/tokens → "Fine-grained tokens" → escolha só o repositório de dados (o privado) → permissão "Contents: Read and write".</p>
      <div class="field"><input id="gh-token" type="password" value="${g.token}" placeholder="github_pat_..."></div>
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn" id="gh-save">Salvar e sincronizar</button>
        <button class="btn ghost" id="gh-test">Testar conexão</button>
      </div>
    </div>
    <div class="card"><h2>Como publicar (2 repositórios, tudo grátis)</h2>
      <ol class="steps">
        <li><strong>Repositório 1 — público, só o site:</strong> crie um repositório (ex: <code>028labs-calculadora</code>), suba este <code>index.html</code> via "Add file → Upload files". Ele não vai conter nenhum dado seu, só o código do app.</li>
        <li>Vá em <code>Settings → Pages</code> desse repositório → "Deploy from a branch" → <code>main</code> → <code>/root</code>. Em 1-2 min você tem um link tipo <code>https://seu-usuario.github.io/028labs-calculadora/</code>.</li>
        <li><strong>Repositório 2 — privado, só os dados:</strong> crie outro repositório (ex: <code>028labs-dados</code>) e marque como <strong>Private</strong>. Pode ficar vazio — o app cria o <code>data.json</code> sozinho no primeiro salvamento.</li>
        <li>Crie o token (passo acima), restrito só a esse repositório privado.</li>
        <li>Abra o link do site (repositório 1), vá nesta aba "Sincronização" e preencha os campos apontando para o <strong>repositório 2</strong> (o privado) + o token.</li>
      </ol>
      <p class="card-note">Resultado: o site é público, mas ninguém vê seus clientes/preços — o <code>data.json</code> só é lido com o seu token, dentro do repositório privado.</p>
      <p class="card-note">Alternativa, se preferir simplicidade a custo zero: pagar o GitHub Pro (~US$ 4/mês) permite publicar Pages a partir de um único repositório já privado, sem precisar separar em dois.</p>
    </div>`;
}

// ---------- events ----------
function bindEvents(){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.onclick = ()=>{ tab=b.dataset.tab; if(tab==='novo' && !editingPedidoId) draft=null; formErrors=[]; render(); };
  });
  document.querySelectorAll('[data-cfg]').forEach(el=>{
    el.onchange = ()=>{ state.config[el.dataset.cfg] = parseFloat(el.value)||0; queueSync(); render(); };
  });
  document.querySelectorAll('[data-cfgbool]').forEach(el=>{
    el.onchange = ()=>{ state.config[el.dataset.cfgbool] = el.checked; queueSync(); render(); };
  });
  const addMat = document.getElementById('add-mat');
  if (addMat) addMat.onclick = ()=>{ state.materiais.push({ id:uid(), nome:'Novo material', marca:'', tipo:'', pesoRolo:1000, precoRolo:0 }); queueSync(); render(); };
  document.querySelectorAll('[data-mat]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const m = state.materiais.find(x=>x.id===id); const k = el.dataset.mat;
      m[k] = (k==='pesoRolo'||k==='precoRolo') ? Math.max(0,parseFloat(el.value)||0) : el.value; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-mat]').forEach(el=>{
    el.onclick = ()=>{ state.materiais = state.materiais.filter(m=>m.id!==el.dataset.delMat); queueSync(); render(); };
  });
  const addImp = document.getElementById('add-imp');
  if (addImp) addImp.onclick = ()=>{ state.impressoras.push({ id:uid(), nome:'Nova impressora', modelo:'', valorAquisicao:0, vidaUtil:8000, potencia:120, manutencaoMensal:0, horasMes:150 }); queueSync(); render(); };
  document.querySelectorAll('[data-imp]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const i = state.impressoras.find(x=>x.id===id); const k = el.dataset.imp;
      i[k] = (k==='nome'||k==='modelo') ? el.value : Math.max(0,parseFloat(el.value)||0); queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-imp]').forEach(el=>{
    el.onclick = ()=>{ state.impressoras = state.impressoras.filter(i=>i.id!==el.dataset.delImp); queueSync(); render(); };
  });
  const addEmb = document.getElementById('add-emb');
  if (addEmb) addEmb.onclick = ()=>{ state.embalagens.push({ id:uid(), nome:'Nova embalagem', valor:0 }); queueSync(); render(); };
  document.querySelectorAll('[data-emb]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const e = state.embalagens.find(x=>x.id===id); const k = el.dataset.emb;
      e[k] = (k==='valor') ? Math.max(0,parseFloat(el.value)||0) : el.value; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-emb]').forEach(el=>{
    el.onclick = ()=>{ state.embalagens = state.embalagens.filter(e=>e.id!==el.dataset.delEmb); queueSync(); render(); };
  });
  const addAdc = document.getElementById('add-adc');
  if (addAdc) addAdc.onclick = ()=>{ state.adicionais.push({ id:uid(), nome:'Novo adicional', valor:0, tipoCobranca:'unidade' }); queueSync(); render(); };
  document.querySelectorAll('[data-adc]').forEach(el=>{
    el.onchange = ()=>{ const id = el.closest('tr').dataset.id; const a = state.adicionais.find(x=>x.id===id); const k = el.dataset.adc;
      a[k] = (k==='valor') ? Math.max(0,parseFloat(el.value)||0) : el.value; queueSync(); render(); };
  });
  document.querySelectorAll('[data-del-adc]').forEach(el=>{
    el.onclick = ()=>{ state.adicionais = state.adicionais.filter(a=>a.id!==el.dataset.delAdc); queueSync(); render(); };
  });
  document.querySelectorAll('[data-dhm]').forEach(el=>{
    el.onchange = ()=>{
      const key = el.dataset.dhm;
      const cur = decompDHM(draft[key]);
      const v = Math.max(0, parseFloat(el.value)||0);
      if (el.dataset.dhmU === 'd') cur.dias = v;
      else if (el.dataset.dhmU === 'h') cur.horas = v;
      else cur.minutos = v;
      draft[key] = composeDHM(cur.dias, cur.horas, cur.minutos);
      render();
    };
  });
  document.querySelectorAll('[data-p]').forEach(el=>{
    el.onchange = ()=>{ const k = el.dataset.p;
      const textKeys = ['data','cliente','produto','status','materialId','impressoraId','acabamentoExtraModo','modoTempoAms','pesoModo'];
      draft[k] = textKeys.includes(k) ? el.value : Math.max(0, parseFloat(el.value)||0);
      render(); };
  });
  document.querySelectorAll('[data-p-bool]').forEach(el=>{
    el.onchange = ()=>{ draft[el.dataset.pBool] = el.checked; render(); };
  });
  const addEmbItem = document.getElementById('add-emb-item');
  if (addEmbItem) addEmbItem.onclick = ()=>{
    const embalagemId = document.getElementById('add-emb-select').value;
    const quantidade = Math.max(1, parseFloat(document.getElementById('add-emb-qtd').value)||1);
    draft.embalagensItens.push({ lineId:uid(), embalagemId, quantidade });
    render();
  };
  document.querySelectorAll('[data-emb-item-qtd]').forEach(el=>{
    el.onchange = ()=>{ const it = draft.embalagensItens.find(x=>x.lineId===el.dataset.embItemQtd);
      if (it) it.quantidade = Math.max(1, parseFloat(el.value)||1); render(); };
  });
  document.querySelectorAll('[data-del-emb-item]').forEach(el=>{
    el.onclick = ()=>{ draft.embalagensItens = draft.embalagensItens.filter(x=>x.lineId!==el.dataset.delEmbItem); render(); };
  });
  const addAdcItem = document.getElementById('add-adc-item');
  if (addAdcItem) addAdcItem.onclick = ()=>{
    const adicionalId = document.getElementById('add-adc-select').value;
    const quantidade = Math.max(1, parseFloat(document.getElementById('add-adc-qtd').value)||1);
    draft.adicionaisItens.push({ lineId:uid(), adicionalId, quantidade });
    render();
  };
  document.querySelectorAll('[data-adc-item-qtd]').forEach(el=>{
    el.onchange = ()=>{ const it = draft.adicionaisItens.find(x=>x.lineId===el.dataset.adcItemQtd);
      if (it) it.quantidade = Math.max(1, parseFloat(el.value)||1); render(); };
  });
  document.querySelectorAll('[data-del-adc-item]').forEach(el=>{
    el.onclick = ()=>{ draft.adicionaisItens = draft.adicionaisItens.filter(x=>x.lineId!==el.dataset.delAdcItem); render(); };
  });
  const saveBtn = document.getElementById('save-pedido');
  if (saveBtn) saveBtn.onclick = ()=>{
    formErrors = validatePedidoForSave(draft, state.config);
    if (formErrors.length){ render(); return; }
    if (editingPedidoId){ const idx = state.pedidos.findIndex(p=>p.id===editingPedidoId); state.pedidos[idx] = { ...draft, id: editingPedidoId }; }
    else { state.pedidos.push({ ...draft, id: uid() }); }
    queueSync(); editingPedidoId = null; draft = null; formErrors = []; tab='lista'; render();
  };
  const cancelBtn = document.getElementById('cancel-pedido');
  if (cancelBtn) cancelBtn.onclick = ()=>{ editingPedidoId=null; draft=null; formErrors=[]; tab='lista'; render(); };
  document.querySelectorAll('[data-edit-pedido]').forEach(el=>{
    el.onclick = ()=>{ editingPedidoId = el.dataset.editPedido; draft = null; formErrors=[]; tab='novo'; render(); };
  });
  document.querySelectorAll('[data-del-pedido]').forEach(el=>{
    el.onclick = ()=>{ state.pedidos = state.pedidos.filter(p=>p.id!==el.dataset.delPedido); queueSync(); render(); };
  });
  const ghSave = document.getElementById('gh-save');
  if (ghSave) ghSave.onclick = async ()=>{
    github.owner = document.getElementById('gh-owner').value.trim();
    github.repo = document.getElementById('gh-repo').value.trim();
    github.branch = document.getElementById('gh-branch').value.trim() || 'main';
    github.path = document.getElementById('gh-path').value.trim() || 'data.json';
    github.token = document.getElementById('gh-token').value.trim();
    saveSettings();
    // Nunca sobrescreve o estado local aqui: só obtém o SHA remoto (se existir) e
    // então grava o estado local atual. O estado local nunca é descartado.
    setSync('busy','Conectando ao GitHub…');
    try{
      ghSha = await ghGetLatestSha();
    } catch(e){
      setSync('err', 'Falha ao conectar ao GitHub: ' + e.message);
      render();
      return;
    }
    await ghPush(false);
    render();
  };
  const ghTest = document.getElementById('gh-test');
  if (ghTest) ghTest.onclick = async ()=>{
    const owner = document.getElementById('gh-owner').value.trim();
    const repo = document.getElementById('gh-repo').value.trim();
    const token = document.getElementById('gh-token').value.trim();
    setSync('busy','Testando…');
    try{
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers:{ Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json' } });
      if (!res.ok) throw new Error(`Resposta ${res.status}`);
      setSync('ok','Conexão OK — repositório encontrado.');
    } catch(e){ setSync('err','Erro: ' + e.message); }
  };
}

init();

</script>
